# gcovr-report — Install gcovr and generate coverage reports (XML + HTML)
#
# Installs gcovr via pip (avoids apt package mismatches), then generates both
# XML (for parsing) and HTML (for deployment) coverage reports from a CMake
# build.
#
# Usage:
#   - name: Generate Coverage
#     uses: ai-warevo/.github/ci/actions/gcovr-report@main
#     with:
#       source_dir: example
#       build_dir: build
#       source_filter: src/ include/
#       exclude: _deps/*
#       output_dir: htmlcov

name: 'GCOVR Coverage Report'
description: 'Install gcovr and generate coverage reports (XML + HTML)'

inputs:
  source_dir:
    description: 'Source directory (relative to workspace)'
    required: false
    default: '.'
  build_dir:
    description: 'Build directory (relative to source_dir)'
    required: false
    default: 'build'
  source_filter:
    description: '--filter patterns (space-separated path prefixes that appear in paths relative to -r, e.g. "src/ include/aw/tpl/")'
    required: false
    default: ''
  exclude:
    description: '--exclude pattern (may be specified multiple times, comma-separated)'
    required: false
    default: '_deps/*'
  output_dir:
    description: 'Output directory for HTML report'
    required: false
    default: 'htmlcov'
  xml_path:
    description: 'Output path for coverage.xml'
    required: false
    default: 'coverage.xml'

outputs:
  xml_path:
    description: 'Path to generated coverage.xml'
    value: ${{ steps.gcovr.outputs.xml_path }}
  html_dir:
    description: 'Path to generated HTML report directory'
    value: ${{ steps.gcovr.outputs.html_dir }}

runs:
  using: 'composite'
  steps:
    - name: Install gcovr
      shell: bash
      run: pip install --quiet gcovr

    - name: Generate coverage reports
      id: gcovr
      shell: bash
      env:
        SOURCE_DIR: ${{ inputs.source_dir }}
        BUILD_DIR: ${{ inputs.build_dir }}
        FILTER: ${{ inputs.source_filter }}
        EXCLUDE: ${{ inputs.exclude }}
        OUTPUT_DIR: ${{ inputs.output_dir }}
        XML_PATH: ${{ inputs.xml_path }}
      run: |
        set -euo pipefail
        mkdir -p "$OUTPUT_DIR"

        # Source root is the build directory. gcovr finds .gcda/.gcno files
        # under -r. The --filter patterns match against file paths relative
        # to -r (e.g. "../../plugin/src/plugin.cpp" contains "plugin/src/").
        SOURCE_ROOT="${SOURCE_DIR}/${BUILD_DIR}"

        # Collect exclude args
        EXCLUDE_ARGS=""
        for pattern in $(echo "$EXCLUDE" | tr ',' ' '); do
          EXCLUDE_ARGS="$EXCLUDE_ARGS --exclude $pattern"
        done

        # Collect filter args — multiple space-separated patterns
        FILTER_ARGS=""
        if [ -n "${FILTER:-}" ]; then
          for pattern in $FILTER; do
            FILTER_ARGS="$FILTER_ARGS --filter $pattern"
          done
        fi

        # Debug: list coverage data files
        echo "=== Coverage data files ==="
        echo "SOURCE_ROOT=$SOURCE_ROOT"
        echo "FILTER=$FILTER"
        echo "EXCLUDE=$EXCLUDE"
        echo "-- .gcda files:"
        find "$SOURCE_ROOT" -name "*.gcda" -not -path "*_deps/*" 2>/dev/null | head -30
        echo "-- .gcno files:"
        find "$SOURCE_ROOT" -name "*.gcno" -not -path "*_deps/*" 2>/dev/null | head -30
        echo "-- relative paths from SOURCE_ROOT (.gcno):"
        (cd "$SOURCE_ROOT" && find . -name "*.gcno" -not -path "*_deps/*" 2>/dev/null | head -30)

        echo "=== gcovr command ==="
        echo "gcovr -r $SOURCE_ROOT $FILTER_ARGS $EXCLUDE_ARGS --xml $XML_PATH --html-details $OUTPUT_DIR/index.html"

        echo "=== Running gcovr with verbose logging ==="
        gcovr -r "$SOURCE_ROOT" \
          --gcov-ignore-errors=no_working_dir_found \
          $FILTER_ARGS \
          $EXCLUDE_ARGS \
          --exclude-unreachable-branches \
          --exclude-throw-branches \
          --print-summary \
          --xml "$XML_PATH" \
          --html-details "$OUTPUT_DIR/index.html" \
          -v 2 2>&1 || true

        echo "=== Coverage XML output ==="
        cat "$XML_PATH" 2>/dev/null || echo "(no XML generated)"

        echo "xml_path=${XML_PATH}" >> $GITHUB_OUTPUT
        echo "html_dir=${OUTPUT_DIR}" >> $GITHUB_OUTPUT
