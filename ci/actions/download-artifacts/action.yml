# download-artifacts — Download and merge multiple GitHub Actions artifacts
#
# Обёртка над actions/download-artifacts@v4 для удобной загрузки
# нескольких артефактов по паттерну с объединением в одну директорию.
#
# Паттерн из production workflow:
#   download-artifact с pattern + merge-multiple
#
# Usage:
#   - name: Download all release artifacts
#     uses: ai-warevo/<repo>/ci/actions/download-artifacts@main
#     with:
#       pattern: '*'
#       merge-multiple: true
#       path: artifacts/

name: 'Download Artifacts (pattern + merge)'
description: 'Download multiple artifacts by pattern and merge into single directory'

inputs:
  pattern:
    description: 'Glob pattern to match artifact names (default: *)'
    required: false
    default: '*'
  merge-multiple:
    description: 'Merge artifacts into a single directory (default: true)'
    required: false
    default: 'true'
  path:
    description: 'Directory to download artifacts into'
    required: false
    default: 'downloaded-artifacts'
  github_token:
    description: 'GitHub token for authentication'
    required: false
    default: ${{ github.token }}

runs:
  using: 'composite'
  steps:
    - name: Download artifacts
      uses: actions/download-artifact@v4
      with:
        pattern: ${{ inputs.pattern }}
        path: ${{ inputs.path }}
        merge-multiple: ${{ inputs.merge-multiple }}
        github_token: ${{ inputs.github_token }}

    - name: List downloaded artifacts
      shell: bash
      run: |
        echo "Downloaded artifacts to ${{ inputs.path }}:"
        if [ -d "${{ inputs.path }}" ]; then
          find "${{ inputs.path }}" -type f | head -50
          echo "---"
          echo "Total files: $(find "${{ inputs.path }}" -type f | wc -l)"
        else
          echo "(directory does not exist — no artifacts found)"
        fi
