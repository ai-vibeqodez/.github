name: 'Release Version Resolver'
description: 'Резолвит релизную версию из тега, workflow_dispatch инпута или run_number'

inputs:
  version:
    description: 'Ручная версия (например, 1.2.3). Оставить пустым для авто-резолва.'
    required: false
    default: ''

outputs:
  release_version:
    description: 'Полная версия с префиксом v (например, v1.2.3)'
    value: ${{ steps.resolve.outputs.release_version }}
  release_version_stripped:
    description: 'Версия без префикса v (например, 1.2.3)'
    value: ${{ steps.resolve.outputs.release_version_stripped }}

runs:
  using: 'composite'
  steps:
    - name: Resolve release version
      id: resolve
      shell: bash
      env:
        EVENT_NAME: ${{ github.event_name }}
        REF_TYPE: ${{ github.ref_type }}
        REF_NAME: ${{ github.ref_name }}
        INPUT_VERSION: ${{ inputs.version }}
      run: |
        set -euo pipefail

        if [ "${REF_TYPE}" = "tag" ]; then
          echo "release_version=${REF_NAME}" >> $GITHUB_OUTPUT
          echo "release_version_stripped=${REF_NAME#v}" >> $GITHUB_OUTPUT
          exit 0
        fi

        if [ "$EVENT_NAME" = "workflow_dispatch" ] && [ -n "$INPUT_VERSION" ]; then
          V="${INPUT_VERSION#v}"
          echo "release_version=v${V}" >> $GITHUB_OUTPUT
          echo "release_version_stripped=${V}" >> $GITHUB_OUTPUT
          exit 0
        fi

        echo "release_version=v0.0.${{ github.run_number }}" >> $GITHUB_OUTPUT
        echo "release_version_stripped=0.0.${{ github.run_number }}" >> $GITHUB_OUTPUT
