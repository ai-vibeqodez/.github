# CI — Universal Template
#
# Copy this file into your project as .github/workflows/ci.yml
# and replace placeholders with real commands for your stack.
#
# Supported stacks (pick the one you need and uncomment):
#   Node.js / TypeScript, Python, C# (.NET), C++ (CMake), Go, Rust, Java, and more.
#
# Triggers: pull_request to main/master, merge_group (on PR merge).
# Regular push to main/master does NOT trigger CI — saves GitHub Actions limits.

name: CI

on:
  pull_request:
    branches: [main, master]
  merge_group:
    branches: [main, master]

# Permissions: contents read for checkout, packages write for GHCR (if needed)
permissions:
  contents: read
  packages: write

# Cancel old incomplete runs for the same PR / branch
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

