      #     node-version: ${{ matrix.node-version }}
      # - run: npm ci
      # - run: npm test -- --coverage

      # ── Python ──
      # - name: Setup Python
      #   uses: actions/setup-python@v5
      #   with:
      #     python-version: ${{ matrix.python-version }}
      # - run: pip install -r requirements.txt
      # - run: pytest --cov=src --cov-report=xml --cov-report=html:htmlcov

      # ── C# (.NET) ──
      # - name: Setup .NET
      #   uses: actions/setup-dotnet@v4
      # - run: dotnet test --collect:"XPlat Code Coverage"

      # ── C++ ──
      # - run: mkdir build && cd build && cmake .. && cmake --build . && ctest --output-on-failure

      # ── Go ──
      # - run: go test -v -cover ./...

      # ── Rust ──
      # - run: cargo test

      - name: Test (placeholder)
        run: echo "call real command to test"

  coverage:
    name: Coverage Report
    runs-on: ubuntu-latest
    needs: test
    if: success()
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # ── Node.js: generate coverage.xml ──
      # - name: Setup Node.js
      #   uses: actions/setup-node@v4
      #   with:
      #     node-version: '20'
      # - run: npm ci
      # - run: npm test -- --coverage --coverageReporters=text --coverageReporters=lcov
      # - name: Convert lcov to xml (or use nyc directly)
      #   run: npx nyc report --reporter=text-lcov > coverage.lcov && genhtml coverage.lcov -o coverage

      # ── Python: generate coverage.xml ──
      # - name: Setup Python
      #   uses: actions/setup-python@v5
      #   with:
      #     python-version: '3.12'
      # - run: pip install -r requirements.txt
      # - run: pytest --cov=src --cov-report=xml:coverage.xml --cov-report=html:htmlcov

      - name: Coverage status
        run: |
          echo "Coverage report placeholder"
          echo "Replace with: codecov, coveralls, or custom report generation"

  badge:
    name: Coverage Badge
    runs-on: ubuntu-latest
    needs: coverage
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Parse Coverage Metrics
        id: coverage_parser
        run: |
          if [ -f "coverage.xml" ]; then
            PERCENTAGE=$(python3 -c "import xml.etree.ElementTree as ET; tree = ET.parse('coverage.xml'); root = tree.getroot(); print(int(float(root.attrib['line-rate']) * 100))")
          elif [ -f "coverage.lcov" ]; then
            PERCENTAGE=$(grep '^DA:' coverage.lcov | awk -F: '{sum+=$2; count++} END {if(count>0) printf "%d", sum/count; else print 0}')
          else
            PERCENTAGE=0
          fi
          echo "DEBUG: Extracted percentage: '$PERCENTAGE'"

          if [ "$PERCENTAGE" -lt 50 ]; then
            COLOR="#e05d44"
          elif [ "$PERCENTAGE" -lt 80 ]; then
            COLOR="#dfb317"
          else
            COLOR="#44cc11"
          fi

          echo "percent=${PERCENTAGE}%" >> $GITHUB_OUTPUT
          echo "color=${COLOR}" >> $GITHUB_OUTPUT

      - name: Generate Coverage Badge
        id: badge_generator
        uses: ai-warevo/.github/ci/actions/badge@main
        with:
          width: '99'
          height: '20'
          text_left: 'coverage'
          text_right: '${{ steps.coverage_parser.outputs.percent }}'
          bg_color_right: '${{ steps.coverage_parser.outputs.color }}'
          filename: 'coverage.svg'

      - name: Deploy Badge
        run: |
          mkdir -p badge-upload
          cp "${{ steps.badge_generator.outputs.badge_path }}" badge-upload/coverage.svg

      - name: Deploy Badge to separate branch
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          branch: badges
          folder: badge-upload
          target-folder: .
          git-config-name: "github-actions[bot]"
          git-config-email: "github-actions[bot]@users.noreply.github.com"
          single-commit: true

      - name: Preparation for HTML Deploy
        if: hashFiles('htmlcov/index.html') != ''
        run: |
          touch htmlcov/.nojekyll

      - name: Deploy Coverage Report to gh-pages
        if: hashFiles('htmlcov/index.html') != ''
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          branch: gh-pages
          folder: htmlcov

  release:
    name: Publish GitHub Release
    needs: badge
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract release notes from CHANGELOG.md
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version="${TAG#v}"

          # Body of "## [<version>]" up to the next "## [" heading or the link references; CRLF-safe.
          notes="$(tr -d '\r' < CHANGELOG.md | awk -v v="$version" '
            /^## \[/ { if (found) exit; if (index($0, "## [" v "]") == 1) { found = 1; next } }
            found && /^\[[^]]+\]:/ { exit }
            found { lines[++n] = $0 }
            END {
              first = 1; while (first <= n && lines[first] ~ /^[ \t]*$/) first++
              while (n >= first && lines[n] ~ /^[ \t]*$/) n--
              for (i = first; i <= n; i++) print lines[i]
            }')"

          if [ -z "$notes" ]; then
            echo "::error::CHANGELOG.md has no entries for [$version]. Run scripts/release.sh (or release.ps1) to cut releases."
            exit 1
          fi

          {
            printf '## ⚡ %s\n\n' "$TAG"
            printf '%s\n\n' "$notes"
            cat <<'EOF'
### 📦 What's Included
- Universal CI/CD workflow templates (ci.yml, test.yml) for Node.js, Python, C#, C++, Go, Rust, Java
- Custom GitHub Action: SVG Badge Generator
- AI skills: analyst, planner, executor, skill-creator, git-github-push
- Project templates: overview, task, README, CHANGELOG, CONTRIBUTING
- LLM server (llama.cpp) with Docker Compose and GPU support

### 🚀 Quick Start

Add coverage badge to your README.md:
```markdown
![Coverage](https://raw.githubusercontent.com/your-org/your-repo/badges/coverage.svg)
```

Copy CI/CD templates:
```bash
cp path/to/ci/.github/workflows/ci.yml .github/workflows/ci.yml
cp path/to/ci/.github/workflows/test.yml .github/workflows/test.yml
```
EOF
          } > release_body.md

          cat release_body.md

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          body_path: release_body.md
