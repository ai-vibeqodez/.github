  coverage:
    name: Coverage Report
    runs-on: ubuntu-latest
    needs: test
    if: success()
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      # ── Node.js: generate coverage.xml ──
      # - name: Setup Node.js
      #   uses: actions/setup-node@v4
      #   with:
      #     node-version: '20'
      # - run: npm ci
      # - run: npm test -- --coverage --coverageReporters=text --coverageReporters=lcov
      # - name: Convert lcov to xml (or use nyc directly)
      #   run: npx nyc report --reporter=text-lcov > coverage.lcov && genhtml coverage.lcov -o coverage

      # ── Python: generate coverage.xml ──
      # - name: Setup Python
      #   uses: actions/setup-python@v5
      #   with:
      #     python-version: '3.12'
      # - run: pip install -r requirements.txt
      # - run: pytest --cov=src --cov-report=xml:coverage.xml --cov-report=html:htmlcov

      # ── C++: generate coverage.xml ──
      # - name: Generate Coverage
      #   uses: ai-warevo/.github/ci/actions/gcovr-report@b9b4ea51339d9f5113da5247b6b80020e29eff38
      #   with:
      #     source_dir: .
      #     build_dir: build
      #     source_filter: src/
      #     output_dir: htmlcov

      - name: Coverage status
        if: false
        run: |
          echo "Coverage report placeholder"
          echo "Replace with: codecov, coveralls, or custom report generation"

  badge:
    name: Coverage Badge
    runs-on: ubuntu-latest
    needs: coverage
    if: success()
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Parse Coverage Metrics
        id: coverage_parser
        uses: ai-warevo/.github/ci/actions/coverage-parser@b9b4ea51339d9f5113da5247b6b80020e29eff38

      - name: Generate Coverage Badge
        id: badge_generator
        uses: ai-warevo/.github/ci/actions/badge@c3d7d4dcbe7188bf39fb5f21a78f2233ec3cc565
        with:
          width: '99'
          height: '20'
          text_left: 'coverage'
          text_right: '${{ steps.coverage_parser.outputs.percent }}'
          bg_color_right: '${{ steps.coverage_parser.outputs.color }}'
          filename: 'coverage.svg'

      - name: Deploy Badge
        uses: ai-warevo/.github/ci/actions/badge-deploy@02c1d2908f8e67123d3b5a3acbe0f17367bcbbed
        with:
          badge_path: coverage.svg

      - name: Deploy Coverage HTML
        if: hashFiles('htmlcov/index.html') != ''
        uses: ai-warevo/.github/ci/actions/coverage-html-deploy@71de6287301964338e41245fc4a3087a77a64475
        with:
          folder: htmlcov
