# Test — Universal Template
#
# Скопируй этот файл в свой проект как .github/workflows/test.yml
# и замени заглушки на реальные команды для твоего стека.
#
# Этот workflow запускается на pull_request к main/master, по расписанию
# (weekly) или вручную. Обычный push в main/master НЕ запускает тесты —
# экономит GitHub Actions лимиты.

name: Test

on:
  pull_request:
    branches: [main, master]
  workflow_dispatch:  # запуск вручную по кнопке

permissions:
  contents: write
  packages: write

# Отменяем старые незавершённые запуски для того же PR / ветки
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test (${{ matrix.os }} / ${{ matrix.node-version || 'default' }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
