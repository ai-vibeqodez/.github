# CI — C++20 Container Template
#
# Скопируй этот файл в свой проект как .github/workflows/ci.yml
# и замени заглушки на реальные команды для твоего проекта.
#
# Linux-jobs работают в Docker-образе
# `ghcr.io/ai-warevo/ci-cpp20` — независимость от ОС GitHub Actions runner.
# Все инструменты (gcc-15, clang-18, cmake, ninja, clang-tidy, clang-format,
# gcovr) предустановлены в образе.
# MSVC-jobs работают на нативном `windows-latest`.
#
# Триггеры: pull_request к main/master, merge_group (при слиянии PR).
# Обычный push в main/master НЕ запускает CI — экономит GitHub Actions лимиты.

name: CI

on:
  pull_request:
    branches: [main, master]
  merge_group:
    branches: [main, master]

# Права: contents read для checkout, packages write для GHCR (если нужен)
permissions:
  contents: read
  packages: write

# Отменяем старые незавершённые запуски для того же PR / ветки
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CI_IMAGE: ghcr.io/ai-warevo/ci-cpp20:latest

jobs:
  # ────────────────────────────────────────────────────────────
  # BUILD — Linux (container) — configure + compile
  # ────────────────────────────────────────────────────────────
  build-linux:
    name: Build Linux (${{ matrix.toolchain }})
    runs-on: ubuntu-latest
    container:
      image: ${{ env.CI_IMAGE }}
      options: --user root
    strategy:
      fail-fast: false
      matrix:
        toolchain:
          - clang18-libcxx
          - gcc15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup toolchain
        id: tc
        uses: ai-warevo/.github/ci/actions/setup-toolchain@main
        with:
          toolchain: ${{ matrix.toolchain }}
          container_mode: true

      - name: Configure & Build
        uses: ai-warevo/.github/ci/actions/cmake-build@main
        with:
          source_dir: .
          build_dir: build
          build_type: Release
          extra_args: "${{ steps.tc.outputs.cmake_args }} -DCMAKE_EXPORT_COMPILE_COMMANDS=ON"

  # ────────────────────────────────────────────────────────────
  # BUILD — Windows (MSVC native runner)
  # ────────────────────────────────────────────────────────────
  build-windows:
    name: Build Windows (MSVC)
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup MSVC environment
        uses: ilammy/msvc-dev-cmd@v1

      - name: Setup toolchain
        id: tc
        uses: ai-warevo/.github/ci/actions/setup-toolchain@main
        with:
          toolchain: msvc

      - name: Configure & Build
        uses: ai-warevo/.github/ci/actions/cmake-build@main
        with:
          source_dir: .
          build_dir: build
          build_type: Release
          extra_args: "${{ steps.tc.outputs.cmake_args }}"

  # ────────────────────────────────────────────────────────────
  # LINT — Linux (clang-tidy + clang-format)
  # ────────────────────────────────────────────────────────────
  lint:
    name: Lint
    runs-on: ubuntu-latest
    container:
      image: ${{ env.CI_IMAGE }}
      options: --user root
    needs: build-linux
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Build with compile_commands.json for clang-tidy
      - name: Setup toolchain
        id: tc
        uses: ai-warevo/.github/ci/actions/setup-toolchain@main
        with:
          toolchain: clang18-libcxx
          container_mode: true

      - name: Configure (for compile_commands.json)
        uses: ai-warevo/.github/ci/actions/cmake-build@main
        with:
          source_dir: .
          build_dir: build
          build_type: Release
          extra_args: "${{ steps.tc.outputs.cmake_args }} -DCMAKE_EXPORT_COMPILE_COMMANDS=ON"
          parallel: false

      - name: clang-format check
        uses: ai-warevo/.github/ci/actions/clang-format@main
        with:
          source_dir: .
          extensions: cpp,hpp
          exclude: _deps/*,build/*,CMakeFiles/*,cmake/*

      - name: clang-tidy
        uses: ai-warevo/.github/ci/actions/clang-tidy@main
        with:
          source_dir: .
          build_dir: build
          header_filter: '.*'
          exclude: _deps/*,build/*,CMakeFiles/*,cmake/*

  # ────────────────────────────────────────────────────────────
  # TEST — Linux (run ctest in container)
  # ────────────────────────────────────────────────────────────
  test-linux:
    name: Test Linux
    runs-on: ubuntu-latest
    container:
      image: ${{ env.CI_IMAGE }}
      options: --user root
    needs: [build-linux, lint]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup toolchain
        id: tc
        uses: ai-warevo/.github/ci/actions/setup-toolchain@main
        with:
          toolchain: clang18-libcxx
          container_mode: true

      - name: Configure & Build (Debug)
        uses: ai-warevo/.github/ci/actions/cmake-build@main
        with:
          source_dir: .
          build_dir: build
          build_type: Debug
          extra_args: "${{ steps.tc.outputs.cmake_args }}"

      - name: Run Tests
        uses: ai-warevo/.github/ci/actions/ctest-run@main
        with:
          source_dir: .
          build_dir: build
          config: Debug

  # ────────────────────────────────────────────────────────────
  # TEST — Windows (run ctest on native MSVC runner)
  # ────────────────────────────────────────────────────────────
  test-windows:
    name: Test Windows
    runs-on: windows-latest
    needs: build-windows
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup MSVC environment
        uses: ilammy/msvc-dev-cmd@v1

      - name: Setup toolchain
        id: tc
        uses: ai-warevo/.github/ci/actions/setup-toolchain@main
        with:
          toolchain: msvc

      - name: Configure & Build (Debug)
        uses: ai-warevo/.github/ci/actions/cmake-build@main
        with:
          source_dir: .
          build_dir: build
          build_type: Debug
          extra_args: "${{ steps.tc.outputs.cmake_args }}"

      - name: Run Tests
        uses: ai-warevo/.github/ci/actions/ctest-run@main
        with:
          source_dir: .
          build_dir: build
          config: Debug
