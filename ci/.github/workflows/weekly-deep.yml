  coverage:
    name: Coverage Report
    runs-on: ubuntu-latest
    needs: test
    if: success()
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      # ── Node.js: generate coverage.xml ──
      # - name: Setup Node.js
