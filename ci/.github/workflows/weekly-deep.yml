# weekly-deep — e2e, integration, sanitizers (ASan, TSan, UBSan)
#
# Copy this file into your project as .github/workflows/weekly-deep.yml
# and replace placeholders with real commands for your stack.
#
# Triggers: pull_request to main/master, weekly schedule, manual dispatch.

name: weekly-deep

on:
  pull_request:
    branches: [main, master]
  schedule:
    - cron: '0 0 * * 1'  # every Monday at 00:00 UTC
  workflow_dispatch:

permissions:
  contents: write
  packages: write

# Cancel old incomplete runs for the same PR / branch
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test (${{ matrix.os }} / ${{ matrix.node-version || 'default' }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        # Add your own matrix parameters for your stack:
        # node-version: ['18', '20', '22']
        # python-version: ['3.10', '3.11', '3.12']

    steps:
