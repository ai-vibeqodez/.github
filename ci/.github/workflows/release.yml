# Release — Publish GitHub Release from CHANGELOG
#
# Скопируй этот файл в свой проект как .github/workflows/release.yml
#
# Триггер: пуш релизного тега v* (например, через `make release`).
# Использует composite action `changelog-release` для генерации release body.

name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    name: Publish GitHub Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Generate Release Body
        id: changelog
        uses: ai-warevo/.github/ci/actions/changelog-release@main
        with:
          tag: ${{ github.ref_name }}

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          body_path: ${{ steps.changelog.outputs.body_path }}
