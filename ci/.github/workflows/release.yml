# Release — Universal Template
#
# Copy this file into your project as .github/workflows/release.yml
# and replace placeholders with real commands for your stack.
#
# Supported stacks (pick the one you need and uncomment):
#   Node.js / TypeScript, Python, C# (.NET), C++ (CMake), Go, Rust, Java, and more.
#
# Triggers: tag push v*, or manual workflow_dispatch with optional version input.
# Uses composite actions: release-version, changelog-release, checksums, docker-build-push

name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Semantic version without v prefix (e.g. 1.2.3). Leave empty for snapshot.'
        required: false
        default: ''

permissions:
  contents: write
  packages: write
  actions: write

# Don't cancel release runs — they must complete
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # ── Build example (language-specific) ──────────────────────────────────
