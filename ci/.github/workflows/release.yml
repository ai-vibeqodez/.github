# Release — Publish GitHub Release from CHANGELOG
#
# Скопируй этот файл в свой проект как .github/workflows/release.yml
#
# Триггер: пуш релизного тега v* (например, через `make release`).
# Создает GitHub Release с body из CHANGELOG.md.

name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    name: Publish GitHub Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract release notes from CHANGELOG.md
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version="${TAG#v}"

          # Body of "## [<version>]" up to the next "## [" heading or the link references; CRLF-safe.
          notes="$(tr -d '\r' < CHANGELOG.md | awk -v v="$version" '
            /^## \[/ { if (found) exit; if (index($0, "## [" v "]") == 1) { found = 1; next } }
            found && /^\[[^]]+\]:/ { exit }
            found { lines[++n] = $0 }
            END {
              first = 1; while (first <= n && lines[first] ~ /^[ \t]*$/) first++
              while (n >= first && lines[n] ~ /^[ \t]*$/) n--
              for (i = first; i <= n; i++) print lines[i]
            }')"

          if [ -z "$notes" ]; then
            echo "::error::CHANGELOG.md has no entries for [$version]. Run scripts/release.sh (or release.ps1) to cut releases."
            exit 1
          fi

          {
            printf '## ⚡ %s\n\n' "$TAG"
            printf '%s\n\n' "$notes"
            cat <<'EOF'
### 📦 What's Included
- Universal CI/CD workflow templates (ci.yml, test.yml) for Node.js, Python, C#, C++, Go, Rust, Java
- Custom GitHub Action: SVG Badge Generator
- AI skills: analyst, planner, executor, skill-creator, git-github-push
- Project templates: overview, task, README, CHANGELOG, CONTRIBUTING
- LLM server (llama.cpp) with Docker Compose and GPU support

### 🚀 Quick Start

Add coverage badge to your README.md:
```markdown
![Coverage](https://raw.githubusercontent.com/your-org/your-repo/badges/coverage.svg)
```

Copy CI/CD templates:
```bash
cp path/to/ci/.github/workflows/ci.yml .github/workflows/ci.yml
cp path/to/ci/.github/workflows/test.yml .github/workflows/test.yml
```
EOF
          } > release_body.md

          cat release_body.md

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          body_path: release_body.md
