# Release — Publish GitHub Release from CHANGELOG
#
# Скопируй этот файл в свой проект как .github/workflows/release.yml
#
# Триггеры:
#   - push тега v* → релиз из CHANGELOG
#   - workflow_dispatch → ручной релиз с версией (input) или snapshot (v0.0.<run_number>)
# Использует composite actions: release-version, changelog-release, checksums

name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Semantic version without v prefix (e.g. 1.2.3). Leave empty for snapshot.'
        required: false
        default: ''

permissions:
  contents: write
  packages: write
  actions: write

# Не отменяем релиз-запуски — они должны завершиться
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Publish GitHub Release
    runs-on: ubuntu-latest
    outputs:
      release_version: ${{ steps.version.outputs.release_version }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve version
        id: version
        uses: ai-warevo/.github/ci/actions/release-version@fdafa1a
        with:
          version: ${{ github.event.inputs.version }}

      - name: Generate Release Body
        id: changelog
        uses: ai-warevo/.github/ci/actions/changelog-release@fdafa1a
        with:
          tag: ${{ steps.version.outputs.release_version }}

      - name: Generate checksums
        id: checksums_generate
        uses: ai-warevo/.github/ci/actions/checksums@fdafa1a
        with:
          artifacts_dir: '.'
          checksums_file: 'SHA256SUMS.txt'

      - name: Verify checksums
        uses: ai-warevo/.github/ci/actions/checksums-verify@fdafa1a
        with:
          artifacts_dir: '.'
          checksums_file: 'SHA256SUMS.txt'

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.release_version }}
          name: ${{ steps.version.outputs.release_version }}
          body_path: ${{ steps.changelog.outputs.body_path }}
          files: |
            SHA256SUMS.txt
          generate_release_notes: false

  # ── Docker image build + GHCR push ──────────────────────────────────────
  docker:
    name: Build and push Docker image
    runs-on: ubuntu-latest
    needs: release

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        uses: ai-warevo/.github/ci/actions/docker-save@fdafa1a
        with:
          image: ghcr.io/ai-warevo/.github/example
          tag: ${{ needs.release.outputs.release_version }}
          output: example-image.tar
          artifact_name: example-image

      - name: Push to GHCR
        uses: ai-warevo/.github/ci/actions/docker-push-ghcr@fdafa1a
        with:
          image: ghcr.io/ai-warevo/.github/example
          version: ${{ needs.release.outputs.release_version }}
          artifact_name: example-image
