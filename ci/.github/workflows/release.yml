  # ── Release job ────────────────────────────────────────────────────────
  release:
    name: Publish GitHub Release
    runs-on: ubuntu-latest
    needs: build-example
    outputs:
      release_version: ${{ needs.build-example.outputs.release_version }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0

      - name: Generate Release Body
        id: changelog
        uses: ai-warevo/.github/.github/actions/changelog-release@72e62471355bf347d09c7e183af5fd33bf41fbaf
        with:
          tag: ${{ needs.build-example.outputs.release_version }}

      - name: Download build artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: build-${{ needs.build-example.outputs.release_version }}
          path: artifacts

      - name: Generate checksums
        id: checksums_generate
        uses: ai-warevo/.github/.github/actions/checksums@72e62471355bf347d09c7e183af5fd33bf41fbaf
        with:
          artifacts_dir: 'artifacts'
          checksums_file: 'SHA256SUMS.txt'

      - name: Verify checksums
        uses: ai-warevo/.github/.github/actions/checksums-verify@3166e731dcbbe7827136a9232c983fb0c22a5911
        with:
          artifacts_dir: 'artifacts'
          checksums_file: 'SHA256SUMS.txt'

      - name: Create Release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65
        with:
          tag_name: ${{ needs.build-example.outputs.release_version }}
          name: ${{ needs.build-example.outputs.release_version }}
          body_path: ${{ steps.changelog.outputs.body_path }}
          files: |
            artifacts/SHA256SUMS.txt
          generate_release_notes: false

  # ── Docker image build + GHCR push ─────────────────────────────────────
  docker:
    name: Build and push Docker image
    runs-on: ubuntu-latest
    needs: release

    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Build and push Docker image
        uses: ai-warevo/.github/.github/actions/docker-build-push@3166e731dcbbe7827136a9232c983fb0c22a5911
        with:
          context: .
          dockerfile: Dockerfile
          image_name: ghcr.io/${{ github.repository }}
          tags: |
            ghcr.io/${{ github.repository }}:${{ needs.release.outputs.release_version }}
            ghcr.io/${{ github.repository }}:latest
