# release — build + release + publish Docker image
#
# Template: copy this file into your project's .github/workflows/ and
# customize the `on:` trigger and `with:` inputs.
#
# The actual CI logic lives in the reusable workflow:
#   ai-warevo/.github/.github/workflows/reusable-release.yml
#
# To customize, change only this file — never the reusable workflow.

name: release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Semantic version without v prefix (e.g. 1.2.3). Leave empty for snapshot.'
        required: false
        default: ''

jobs:
  release:
    uses: ai-warevo/.github/.github/workflows/reusable-release.yml@2ea4e63f69c0d83ef3e1197ed11948c5d36a28aa
    with:
      source_dir: example
      build_dir: build
      docker_context: ./example
      dockerfile: example/Dockerfile
      image_name: example
    secrets: inherit
