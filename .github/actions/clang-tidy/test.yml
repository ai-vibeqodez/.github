# clang-tidy — Unit tests
#
# Tests: run clang-tidy on the example project (requires build with compile_commands.json)

name: clang-tidy — Unit Tests

on:
  workflow_call:

permissions:
  contents: read

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/ai-warevo/ci-cpp20
      options: --user root
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Configure & Build
        uses: ./.github/actions/cmake-build@e9b20ed3a4f8a49bf774a1f1c28c4fb39e27bad5
        with:
          source_dir: example
          build_dir: build
          build_type: Debug
          extra_args: -DAW_EXAMPLE_BUILD_TESTS=ON -DCMAKE_EXPORT_COMPILE_COMMANDS=ON

  test:
    name: clang-tidy
    runs-on: ubuntu-latest
    needs: build
    container:
      image: ghcr.io/ai-warevo/ci-cpp20
      options: --user root
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: clang-tidy — scan example
        id: clang_tidy
        uses: ./.github/actions/clang-tidy@6cae36f7fe728c23b1a6170d09d6dace55edea77
        with:
          source_dir: example
          build_dir: build
          exclude: _deps/*,build/*,CMakeFiles/*,cmake/*

      - name: clang-tidy — validate
        run: echo "✓ clang-tidy — scan complete"
