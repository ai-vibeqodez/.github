name: 'Changelog Version Deriver'
description: 'Derives the next semantic version from [Unreleased] changelog categories'

inputs:
  changelog:
    description: 'Path to CHANGELOG.md (default: CHANGELOG.md)'
    required: false
    default: 'CHANGELOG.md'
  version_file:
    description: 'Path to VERSION file (default: VERSION)'
    required: false
    default: 'VERSION'

outputs:
  version:
    description: 'Derived version without v prefix (e.g., 1.2.3)'
    value: ${{ steps.derive.outputs.version }}
  tag:
    description: 'Full tag with v prefix (e.g., v1.2.3)'
    value: ${{ steps.derive.outputs.tag }}
  categories:
    description: 'Comma-separated list of categories found (e.g., breaking,feature)'
    value: ${{ steps.derive.outputs.categories }}

runs:
  using: 'composite'
  steps:
    - name: Derive version from changelog categories
      id: derive
      shell: bash
      env:
        CHANGELOG_PATH: ${{ inputs.changelog }}
        VERSION_FILE: ${{ inputs.version_file }}
      run: |
        set -euo pipefail

        changelog="$CHANGELOG_PATH"
        version_file="$VERSION_FILE"

        [ -f "$changelog" ] || { echo "::error::CHANGELOG.md not found"; exit 1; }

        # --- Determine current version ---
        current=""

        # Try VERSION file first
        if [ -f "$version_file" ]; then
          current="$(tr -d '[:space:]' < "$version_file" | grep -E '^[0-9]+\.[0-9]+\.[0-9]+$' || true)"
        fi

        # Fallback to git tags
        if [ -z "$current" ]; then
          current="$(git tag --list 'v[0-9]*.[0-9]*.[0-9]*' --sort=-version:refname | head -n1 | sed 's/^v//')"
        fi

        # No previous version — first release
        if [ -z "$current" ]; then
          current="0.0.0"
        fi

        # --- Parse [Unreleased] section for categories ---
        # Extract lines between "## [Unreleased]" and the next "## [" heading
        unreleased="$(awk '
          /^## \[Unreleased\]/ { found = 1; next }
          found && /^## \[/ { exit }
          found { print }
        ' "$changelog")"

        if [ -z "$unreleased" ]; then
          echo "::error::No [Unreleased] section found in $changelog"
          exit 1
        fi

        # --- Determine highest-priority category ---
        # Priority: Breaking > Added > Deprecated > Changed > Removed > Fixed > Security
        has_category() {
          echo "$unreleased" | grep -q "^### $1"
        }

        categories=""
        next_patch="$current"

        if has_category "Breaking"; then
          major="${current%.*}"
          patch="${current##*.}"
          minor="${current#*.}"
          minor="${minor%.*}"
          next_version="$((major + 1)).0.0"
          categories="breaking"
        elif has_category "Added"; then
          major="${current%.*}"
          patch="${current##*.}"
          minor="${current#*.}"
          minor="${minor%.*}"
          next_version="${major}.$((minor + 1)).0"
          categories="added"
        elif has_category "Deprecated"; then
          major="${current%.*}"
          patch="${current##*.}"
          minor="${current#*.}"
          minor="${minor%.*}"
          next_version="${major}.$((minor + 1)).0"
          categories="${categories:+$categories,}deprecated"
        elif has_category "Changed" || has_category "Removed"; then
          major="${current%.*}"
          minor="${current#*.}"
          minor="${minor%.*}"
          patch="${current##*.}"
          next_version="${major}.${minor}.$((patch + 1))"
          categories="${categories:+$categories,}changed"
          has_category "Removed" && categories="${categories},removed"
        elif has_category "Fixed" || has_category "Security"; then
          major="${current%.*}"
          minor="${current#*.}"
          minor="${minor%.*}"
          patch="${current##*.}"
          next_version="${major}.${minor}.$((patch + 1))"
          categories="${categories:+$categories,}fixed"
          has_category "Security" && categories="${categories},security"
        else
          echo "::warning::No recognized categories in [Unreleased]; bumping patch (0.0.1)"
          next_version="0.0.1"
          categories="none"
        fi

        tag="v$next_version"

        echo "version=$next_version" >> $GITHUB_OUTPUT
        echo "tag=$tag" >> $GITHUB_OUTPUT
        echo "categories=$categories" >> $GITHUB_OUTPUT
        echo "Derived $next_version from categories: $categories (current: $current)"
