name: Reusable PR CI

on:
  workflow_call:
    inputs:
      setup-command:
        description: Optional shell command to install the caller repository's toolchain
        required: false
        type: string
        default: ''

permissions:
  contents: read

concurrency:
  group: reusable-pr-${{ github.repository }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  ci-fast:
    name: Commit validation and fast checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout caller repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate commit messages
        shell: bash
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
          PUSH_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          if [[ "${GITHUB_EVENT_NAME}" == "pull_request" ]]; then
            range="${PR_BASE_SHA}..${PR_HEAD_SHA}"
          else
            before="${PUSH_BEFORE}"
            if [[ -z "$before" || "$before" =~ ^0+$ ]]; then
              before="$(git rev-list --max-parents=0 "$PUSH_SHA" | tail -n1)"
            fi
            range="${before}..${PUSH_SHA}"
          fi
          mapfile -t commits < <(git rev-list --reverse "$range")
          if (( ${#commits[@]} == 0 )); then
            echo "No commits to validate."
            exit 0
          fi
          types='feat|fix|docs|style|refactor|perf|test|build|ci|chore|revert'
          pattern="^(${types})(\\([[:alnum:]_./-]+\\))?(!)?: .{1,88}$"
          for commit in "${commits[@]}"; do
            subject="$(git show -s --format=%s "$commit")"
            if [[ "$subject" =~ ^release\ v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              continue
            fi
            if (( ${#subject} > 88 )) || [[ ! "$subject" =~ $pattern ]]; then
              printf 'Invalid commit subject (%d chars): %s\n' "${#subject}" "$subject" >&2
              exit 1
            fi
          done

      - name: Set up caller toolchain
        if: ${{ inputs.setup-command != '' }}
        shell: bash
        env:
          SETUP_COMMAND: ${{ inputs.setup-command }}
        run: eval "$SETUP_COMMAND"

      - name: Run fast CI contract
        run: make ci-fast
