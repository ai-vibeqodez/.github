# actions-test — Test every composite action in ci/actions/
#
# Manual dispatch only (workflow_dispatch). Copies to consumer repos and
# references actions via ai-warevo/.github/ci/actions/<name>@main.
# All 16 actions covered: unit(6) → deploy(4) → artifacts(2) → integration(5)
# → release(4) → docker-push(2) → edge-cases(4).

name: Actions Test

on:
  workflow_dispatch:

permissions:
  contents: write
  packages: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ──────────────────────────────────────────────
  # UNIT — Individual action tests (matrix per action)
  # ──────────────────────────────────────────────
  unit:
    name: Unit (${{ matrix.action }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        action:
          - badge
          - changelog-release
          - checksums
          - checksums-verify
          - coverage-parser
          - release-version
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # ─── badge ───
      - name: badge — custom params
        if: matrix.action == 'badge'
        id: badge
        uses: ai-warevo/.github/ci/actions/badge@main
        with:
          width: '200'
          height: '30'
          text_left: 'coverage'
          text_right: '95%'
          bg_color_left: '#333'
          bg_color_right: '#22cc11'
          text_color: '#fff'
          filename: 'custom.svg'

      - name: badge — validate custom
        if: matrix.action == 'badge'
        run: |
          set -euo pipefail
          [ -f custom.svg ] || { echo "::error::custom.svg not created"; exit 1; }
          grep -q '<svg' custom.svg || { echo "::error::Invalid SVG"; exit 1; }
          grep -q '200' custom.svg || { echo "::error::Width mismatch"; exit 1; }
          grep -q 'coverage' custom.svg || { echo "::error::Text missing"; exit 1; }
          grep -q '95%' custom.svg || { echo "::error::Value missing"; exit 1; }
          echo "✓ badge custom params"

      - name: badge — defaults
        if: matrix.action == 'badge'
        id: badge_def
        uses: ai-warevo/.github/ci/actions/badge@main
        with:
          text_left: 'coverage'
          text_right: '80%'
          bg_color_right: '#44cc11'
          filename: 'default.svg'

      - name: badge — validate defaults
        if: matrix.action == 'badge'
        run: |
          set -euo pipefail
          [ -f default.svg ] || { echo "::error::default.svg not created"; exit 1; }
          grep -q '120' default.svg || { echo "::error::Default width mismatch"; exit 1; }
          grep -q '20' default.svg || { echo "::error::Default height mismatch"; exit 1; }
          echo "✓ badge defaults"

      - name: badge — nested output
        if: matrix.action == 'badge'
        id: badge_nested
        uses: ai-warevo/.github/ci/actions/badge@main
        with:
          text_left: 'cov'
          text_right: '100%'
          bg_color_right: '#44cc11'
          filename: 'sub/dir/badge.svg'

      - name: badge — validate nested
        if: matrix.action == 'badge'
        run: |
          set -euo pipefail
          [ -f sub/dir/badge.svg ] || { echo "::error::Nested SVG not created"; exit 1; }
          echo "✓ badge nested output"

      # ─── release-version ───
      - name: release-version — tag event
        if: matrix.action == 'release-version'
        id: rv_tag
        uses: ai-warevo/.github/ci/actions/release-version@main
        with:
          version: 'v1.2.3'

      - name: release-version — validate tag
        if: matrix.action == 'release-version'
        run: |
          set -euo pipefail
          [ "${{ steps.rv_tag.outputs.release_version }}" = "v1.2.3" ] || \
            { echo "::error::release_version mismatch"; exit 1; }
          [ "${{ steps.rv_tag.outputs.release_version_stripped }}" = "1.2.3" ] || \
            { echo "::error::stripped mismatch"; exit 1; }
          echo "✓ release-version tag"

      - name: release-version — dispatch with v-prefix
        if: matrix.action == 'release-version'
        id: rv_v
        uses: ai-warevo/.github/ci/actions/release-version@main
        with:
          version: 'v2.0.0'

      - name: release-version — validate v-prefix
        if: matrix.action == 'release-version'
        run: |
          set -euo pipefail
          [ "${{ steps.rv_v.outputs.release_version }}" = "v2.0.0" ] || \
            { echo "::error::Expected v2.0.0, got ${{ steps.rv_v.outputs.release_version }}"; exit 1; }
          echo "✓ release-version v-prefix"

      - name: release-version — empty dispatch (fallback)
        if: matrix.action == 'release-version'
        id: rv_empty
        uses: ai-warevo/.github/ci/actions/release-version@main
        with:
          version: ''

      - name: release-version — validate fallback
        if: matrix.action == 'release-version'
        run: |
          set -euo pipefail
          [ -n "${{ steps.rv_empty.outputs.release_version }}" ] || \
            { echo "::error::Fallback version empty"; exit 1; }
          echo "✓ release-version fallback: ${{ steps.rv_empty.outputs.release_version }}"

      # ─── changelog-release ───
      - name: changelog-release — existing tag
        if: matrix.action == 'changelog-release'
        id: cr_existing
        uses: ai-warevo/.github/ci/actions/changelog-release@main
        with:
          tag: v1.2.12
          changelog: CHANGELOG.md
          release-body: release_existing.md

      - name: changelog-release — validate existing
        if: matrix.action == 'changelog-release'
        run: |
          set -euo pipefail
          [ -f release_existing.md ] || { echo "::error::Release body missing"; exit 1; }
          grep -q 'v1.2.12' release_existing.md || { echo "::error::Version missing"; exit 1; }
          echo "✓ changelog-release existing tag"

      - name: changelog-release — missing tag
        if: matrix.action == 'changelog-release'
        id: cr_missing
        uses: ai-warevo/.github/ci/actions/changelog-release@main
        with:
          tag: v9.9.9
          changelog: CHANGELOG.md
          release-body: release_missing.md

      - name: changelog-release — validate missing
        if: matrix.action == 'changelog-release'
        run: |
          set -euo pipefail
          [ -f release_missing.md ] || { echo "::error::Missing tag body not created"; exit 1; }
          echo "✓ changelog-release missing tag"

      # ─── checksums ───
      - name: checksums — single file
        if: matrix.action == 'checksums'
        id: cs_single
        uses: ai-warevo/.github/ci/actions/checksums@main
        with:
          artifacts_dir: .

      - name: checksums — validate single
        if: matrix.action == 'checksums'
        run: |
          set -euo pipefail
          [ -f SHA256SUMS.txt ] || { echo "::error::SHA256SUMS.txt not created"; exit 1; }
          echo "✓ checksums single file"

      - name: checksums — custom filename
        if: matrix.action == 'checksums'
        id: cs_custom
        uses: ai-warevo/.github/ci/actions/checksums@main
        with:
          artifacts_dir: .
          checksums_file: custom_sums.txt

      - name: checksums — validate custom
        if: matrix.action == 'checksums'
        run: |
          set -euo pipefail
          [ -f custom_sums.txt ] || { echo "::error::Custom sums not created"; exit 1; }
          echo "✓ checksums custom filename"

      # ─── checksums-verify ───
      - name: checksums-verify — valid
        if: matrix.action == 'checksums-verify'
        id: cv_valid
        uses: ai-warevo/.github/ci/actions/checksums-verify@main
        with:
          artifacts_dir: .
          checksums_file: SHA256SUMS.txt

      - name: checksums-verify — prepare invalid checksums file
        if: matrix.action == 'checksums-verify'
        run: |
          set -euo pipefail
          echo "badhash  somefile" > bad_sha.txt

      - name: checksums-verify — invalid
        if: matrix.action == 'checksums-verify'
        id: cv_invalid
        uses: ai-warevo/.github/ci/actions/checksums-verify@main@main
        with:
          artifacts_dir: .
          checksums_file: bad_sha.txt
        continue-on-error: true

      - name: checksums-verify — validate invalid
        if: matrix.action == 'checksums-verify'
        run: |
          set -euo pipefail
          [ "${{ steps.cv_invalid.outcome }}" = "failure" ] || \
            { echo "::error::Invalid checksums should fail"; exit 1; }
          echo "✓ checksums-verify rejects invalid"

      # ─── coverage-parser ───
      - name: coverage-parser — high coverage
        if: matrix.action == 'coverage-parser'
        id: cp_high
        run: |
          set -euo pipefail
          mkdir -p /tmp/cov-test
          cat > /tmp/cov-test/coverage.xml <<'EOF'
          <?xml version="1.0" encoding="UTF-8"?>
          <coverage line-rate="0.95" branch-rate="0.80" version="1.9">
            <lines>
              <line hits="1" number="1"/>
              <line hits="1" number="2"/>
              <line hits="0" number="3"/>
            </lines>
          </coverage>
          EOF

      - name: coverage-parser — parse high
        if: matrix.action == 'coverage-parser'
        id: cp_parse
        uses: ai-warevo/.github/ci/actions/coverage-parser@main@main
        with:
          xml_path: /tmp/cov-test/coverage.xml

      - name: coverage-parser — validate high
        if: matrix.action == 'coverage-parser'
        run: |
          set -euo pipefail
          [ "${{ steps.cp_parse.outputs.percent }}" = "95%" ] || \
            { echo "::error::Expected 95%, got ${{ steps.cp_parse.outputs.percent }}"; exit 1; }
          [ "${{ steps.cp_parse.outputs.color }}" = "#44cc11" ] || \
            { echo "::error::Expected #44cc11, got ${{ steps.cp_parse.outputs.color }}"; exit 1; }
          echo "✓ coverage-parser high coverage"

      - name: coverage-parser — zero coverage
        if: matrix.action == 'coverage-parser'
        id: cp_zero
        run: |
          set -euo pipefail
          mkdir -p /tmp/cov-test
          cat > /tmp/cov-test/coverage.xml <<'EOF'
          <?xml version="1.0" encoding="UTF-8"?>
          <coverage line-rate="0" branch-rate="0" version="1.9">
            <lines>
              <line hits="0" number="1"/>
            </lines>
          </coverage>
          EOF

      - name: coverage-parser — parse zero
        if: matrix.action == 'coverage-parser'
        id: cp_zero_parse
        uses: ai-warevo/.github/ci/actions/coverage-parser@main@main
        with:
          xml_path: /tmp/cov-test/coverage.xml

      - name: coverage-parser — validate zero
        if: matrix.action == 'coverage-parser'
        run: |
          set -euo pipefail
          [ "${{ steps.cp_zero_parse.outputs.percent }}" = "0%" ] || \
            { echo "::error::Expected 0%, got ${{ steps.cp_zero_parse.outputs.percent }}"; exit 1; }
          [ "${{ steps.cp_zero_parse.outputs.color }}" = "#e05d44" ] || \
            { echo "::error::Expected #e05d44, got ${{ steps.cp_zero_parse.outputs.color }}"; exit 1; }
          echo "✓ coverage-parser zero coverage"

      - name: coverage-parser — missing file (default 0)
        if: matrix.action == 'coverage-parser'
        id: cp_missing
        uses: ai-warevo/.github/ci/actions/coverage-parser@main@main
        with:
          xml_path: /nonexistent/coverage.xml

      - name: coverage-parser — validate missing
        if: matrix.action == 'coverage-parser'
        run: |
          set -euo pipefail
          [ "${{ steps.cp_missing.outputs.percent }}" = "0%" ] || \
            { echo "::error::Expected 0% for missing file, got ${{ steps.cp_missing.outputs.percent }}"; exit 1; }
          echo "✓ coverage-parser missing file → 0%"

  # ──────────────────────────────────────────────
  # DEPLOY — Pages + Docker (requires permissions)
  # ──────────────────────────────────────────────
  deploy:
    name: Deploy Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # ── badge-deploy ──
      - name: Generate badge for deploy
        id: badge
        uses: ai-warevo/.github/ci/actions/badge@main
        with:
          text_left: 'coverage'
          text_right: '90%'
          bg_color_right: '#44cc11'
          filename: 'coverage.svg'

      - name: badge-deploy — to test branch
        id: badge_deploy
        uses: ai-warevo/.github/ci/actions/badge-deploy@main
        with:
          badge_path: coverage.svg
          branch: actions-test/badge
          target_folder: test-badges

      - name: badge-deploy — validate
        if: success()
        run: echo "✓ badge-deploy → actions-test:test-badges/"

      # ── coverage-html-deploy ──
      - name: Generate coverage.xml for deploy
        id: cov
        run: |
          mkdir -p /tmp/cov-test
          cat > /tmp/cov-test/coverage.xml <<'EOF'
          <?xml version="1.0" encoding="UTF-8"?>
          <coverage line-rate="0.85" branch-rate="0.70" version="1.9">
            <lines>
              <line hits="1" number="1"/>
              <line hits="1" number="2"/>
              <line hits="0" number="3"/>
            </lines>
          </coverage>
          EOF
          cp /tmp/cov-test/coverage.xml coverage.xml
          mkdir -p htmlcov
          cat > htmlcov/index.html <<'EOF'
          <html><body>Coverage Report</body></html>
          EOF

      - name: coverage-html-deploy — to test branch
        id: html_deploy
        uses: ai-warevo/.github/ci/actions/coverage-html-deploy@main
        with:
          folder: htmlcov
          branch: actions-test/coverage
          target_folder: test-coverage

      - name: coverage-html-deploy — validate
        if: success()
        run: echo "✓ coverage-html-deploy → actions-test:test-coverage/"

      # ── docker-save ──
      - name: docker-save — build & save
        id: docker_save
        if: success()
        uses: ai-warevo/.github/ci/actions/docker-save@main
        with:
          image: alpine
          tag: '3.19'
          output: alpine-image.tar
          artifact_name: test-docker-image

      - name: docker-save — validate
        if: success()
        run: |
          set -euo pipefail
          [ -f alpine-image.tar ] || { echo "::error::Docker tar not created"; exit 1; }
          echo "✓ docker-save → alpine-image.tar"

      # ── docker-build-push ──
      - name: docker-build-push — build only (no push)
        id: docker_build
        if: success()
        uses: ai-warevo/.github/ci/actions/docker-build-push@main
        with:
          context: .
          dockerfile: example/Dockerfile
          registry: ghcr.io
          image_name: ghcr.io/${{ github.repository_owner }}/actions-test
          tags: |
            ghcr.io/${{ github.repository_owner }}/actions-test:test
          push: 'false'

      - name: docker-build-push — validate build
        if: success()
        run: |
          set -euo pipefail
          docker images ghcr.io/${{ github.repository_owner }}/actions-test:test 2>/dev/null | grep test || \
            { echo "::error::Image not built"; exit 1; }
          echo "✓ docker-build-push — build OK (push=false)"

  # ──────────────────────────────────────────────
  # ARTIFACTS — download + collect
  # ──────────────────────────────────────────────
  artifacts-producer:
    name: Artifacts Producer
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Create artifact 1
        run: echo "hello" > file1.txt

      - name: Upload artifact 1
        uses: actions/upload-artifact@v4
        with:
          name: test-file1
          path: file1.txt
          retention-days: 1

      - name: Create artifact 2
        run: echo "world" > file2.txt

      - name: Upload artifact 2
        uses: actions/upload-artifact@v4
        with:
          name: test-file2
          path: file2.txt
          retention-days: 1

  artifacts-consumer:
    name: Artifacts Consumer
    runs-on: ubuntu-latest
    needs: artifacts-producer
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # ── download-artifacts ──
      - name: download-artifacts — pattern *
        id: download_all
        uses: ai-warevo/.github/ci/actions/download-artifacts@main
        with:
          pattern: 'test-*'
          merge-multiple: 'true'
          path: downloaded

      - name: download-artifacts — validate
        if: success()
        run: |
          set -euo pipefail
          [ -f downloaded/file1.txt ] || { echo "::error::file1.txt missing"; exit 1; }
          [ -f downloaded/file2.txt ] || { echo "::error::file2.txt missing"; exit 1; }
          grep -q 'hello' downloaded/file1.txt || { echo "::error::file1 content wrong"; exit 1; }
          grep -q 'world' downloaded/file2.txt || { echo "::error::file2 content wrong"; exit 1; }
          echo "✓ download-artifacts — merged correctly"

      # ── collect-release-assets ──
      # collect-release-assets internally calls actions/download-artifact@v4 with pattern '*'
      # which would download artifacts from ALL jobs. Since docker-push hasn't run yet,
      # that's wasteful. Instead we test the organize+checksum logic by uploading known
      # artifacts first, then invoking collect-release-assets.
      - name: collect-release-assets — upload test assets
        if: success()
        run: |
          mkdir -p /tmp/collect-test
          echo "binary-linux" > /tmp/collect-test/linux.bin
          echo "binary-win" > /tmp/collect-test/windows.exe
          echo "binary-mac" > /tmp/collect-test/macos

      - name: collect-release-assets — upload as artifacts
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: collect-test-asset
          path: /tmp/collect-test
          retention-days: 1

      - name: collect-release-assets — collect
        id: collect
        if: success()
        uses: ai-warevo/.github/ci/actions/collect-release-assets@main
        with:
          version: '0.0.1-test'
          output_dir: /tmp/collect-test-output
          include_checksums: 'false'
          github_token: ${{ github.token }}

      - name: collect-release-assets — validate
        if: success()
        run: |
          set -euo pipefail
          [ -d "/tmp/collect-test-output/0.0.1-test" ] || \
            { echo "::error::Version dir not created"; exit 1; }
          echo "✓ collect-release-assets — organized"

  # ──────────────────────────────────────────────
  # INTEGRATION — Full C++ pipeline
  # ──────────────────────────────────────────────
  integration:
    name: Integration (C++ pipeline)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build gcovr

      - name: Configure & Build
        id: build
        uses: ai-warevo/.github/ci/actions/cmake-build@main
        with:
          source_dir: example
          build_dir: build
          build_type: Debug
          extra_args: -DAW_EXAMPLE_BUILD_TESTS=ON -DAW_EXAMPLE_ENABLE_COVERAGE=ON

      - name: Run tests
        id: test
        uses: ai-warevo/.github/ci/actions/ctest-run@main
        with:
          source_dir: example
          build_dir: build
          config: Debug
          output_on_failure: 'true'

      - name: Generate coverage
        id: coverage
        uses: ai-warevo/.github/ci/actions/gcovr-report@main
        with:
          source_dir: example
          build_dir: build
          source_filter: host/src/ plugin/src/ include/
          exclude: _deps/*
          output_dir: htmlcov
          xml_path: coverage.xml

      - name: Parse coverage
        id: parse
        uses: ai-warevo/.github/ci/actions/coverage-parser@main
        with:
          xml_path: coverage.xml

      - name: Generate badge
        id: badge
        uses: ai-warevo/.github/ci/actions/badge@main
        with:
          width: '120'
          height: '20'
          text_left: 'coverage'
          text_right: '${{ steps.parse.outputs.percent }}'
          bg_color_left: '#555'
          bg_color_right: '${{ steps.parse.outputs.color }}'
          text_color: '#fff'
          filename: 'coverage.svg'

      - name: Validate integration
        run: |
          set -euo pipefail
          [ -d "example/build" ] || { echo "::error::Build dir missing"; exit 1; }
          [ -f "coverage.xml" ] || { echo "::error::coverage.xml missing"; exit 1; }
          [ -f "htmlcov/index.html" ] || { echo "::error::HTML report missing"; exit 1; }
          [ -f "coverage.svg" ] || { echo "::error::Badge missing"; exit 1; }
          grep -q '<svg' coverage.svg || { echo "::error::Badge invalid"; exit 1; }
          echo "✓ C++ pipeline: build → test → coverage → parse → badge"

  # ──────────────────────────────────────────────
  # RELEASE FLOW
  # ──────────────────────────────────────────────
  release:
    name: Release Flow
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve version
        id: version
        uses: ai-warevo/.github/ci/actions/release-version@main
        with:
          version: '1.2.3'

      - name: Validate version
        run: |
          set -euo pipefail
          [ "${{ steps.version.outputs.release_version }}" = "v1.2.3" ] || \
            { echo "::error::release_version mismatch"; exit 1; }
          [ "${{ steps.version.outputs.release_version_stripped }}" = "1.2.3" ] || \
            { echo "::error::stripped mismatch"; exit 1; }
          echo "✓ release-version"

      - name: Generate release body
        id: changelog
        uses: ai-warevo/.github/ci/actions/changelog-release@main
        with:
          tag: v1.2.12
          changelog: CHANGELOG.md
          release-body: release_body.md

      - name: Validate release body
        run: |
          set -euo pipefail
          [ -f release_body.md ] || { echo "::error::Release body missing"; exit 1; }
          grep -q 'v1.2.12' release_body.md || { echo "::error::Version mismatch"; exit 1; }
          echo "✓ changelog-release"

      - name: Generate checksums
        id: checksums
        uses: ai-warevo/.github/ci/actions/checksums@main
        with:
          artifacts_dir: .

      - name: Validate checksums
        run: |
          set -euo pipefail
          [ -f SHA256SUMS.txt ] || { echo "::error::Checksums missing"; exit 1; }
          echo "✓ checksums"

      - name: Verify checksums
        uses: ai-warevo/.github/ci/actions/checksums-verify@main
        with:
          artifacts_dir: .
          checksums_file: SHA256SUMS.txt
      - name: Validate verify
        run: echo "✓ checksums-verify"

  # ──────────────────────────────────────────────
  # DOCKER PUSH GHCR — full save → load → push flow
  # ──────────────────────────────────────────────
  docker-push:
    name: Docker Push GHCR
    runs-on: ubuntu-latest
    needs: [unit, deploy, artifacts-consumer, integration, release]
    if: success()
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # ── docker-save: build image, save to tar, upload artifact ──
      - name: docker-save — create artifact
        id: docker_save
        uses: ai-warevo/.github/ci/actions/docker-save@main
        with:
          image: alpine
          tag: '3.19'
          output: alpine-push.tar
          artifact_name: docker-image

      - name: docker-save — validate artifact
        run: |
          set -euo pipefail
          [ -f alpine-push.tar ] || { echo "::error::tar not created"; exit 1; }
          echo "✓ docker-save → artifact uploaded"

      # ── docker-push-ghcr: download artifact, load, tag, push ──
      - name: docker-push-ghcr — load & push
        id: docker_push
        uses: ai-warevo/.github/ci/actions/docker-push-ghcr@main
        with:
          image: ghcr.io/${{ github.repository_owner }}/actions-test
          version: '0.0.1-test'
          artifact_name: docker-image
          token: ${{ secrets.GITHUB_TOKEN }}
          push_latest: 'false'

      - name: docker-push-ghcr — validate
        if: success()
        run: echo "✓ docker-push-ghcr — loaded + pushed to GHCR"

  # ──────────────────────────────────────────────
  # EDGE CASES
  # ──────────────────────────────────────────────
  edge-cases:
    name: Edge Cases
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        case:
          - zero_coverage
          - missing_tag
          - empty_dir
          - default_badge
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup
        run: mkdir -p /tmp/edge-tests/empty-dir

      # ── Zero coverage ──
      - name: zero coverage — prepare
        if: matrix.case == 'zero_coverage'
        id: edge_cov
        run: |
          set -euo pipefail
          cat > /tmp/edge-tests/coverage.xml <<'EOF'
          <?xml version="1.0" encoding="UTF-8"?>
          <coverage line-rate="0" branch-rate="0" version="1.9">
            <lines><line hits="0" number="1"/></lines>
          </coverage>
          EOF

      - name: zero coverage — parse
        if: matrix.case == 'zero_coverage'
        id: edge_cov_parse
        uses: ai-warevo/.github/ci/actions/coverage-parser@main@main
        with:
          xml_path: /tmp/edge-tests/coverage.xml

      - name: zero coverage — validate
        if: matrix.case == 'zero_coverage'
        run: |
          set -euo pipefail
          [ "${{ steps.edge_cov_parse.outputs.percent }}" = "0%" ] || \
            { echo "::error::Expected 0%, got ${{ steps.edge_cov_parse.outputs.percent }}"; exit 1; }
          echo "✓ zero coverage"

      # ── Missing tag ──
      - name: missing tag
        if: matrix.case == 'missing_tag'
        id: cr_missing
        uses: ai-warevo/.github/ci/actions/changelog-release@main
        with:
          tag: v9.9.9
          changelog: CHANGELOG.md
          release-body: /tmp/edge-tests/missing.md

      - name: validate missing tag
        if: matrix.case == 'missing_tag'
        run: |
          set -euo pipefail
          [ -f /tmp/edge-tests/missing.md ] || { echo "::error::Body not created"; exit 1; }
          echo "✓ missing tag → empty body"

      # ── Empty dir ──
      - name: empty dir
        if: matrix.case == 'empty_dir'
        id: cs_empty
        uses: ai-warevo/.github/ci/actions/checksums@main
        with:
          artifacts_dir: /tmp/edge-tests/empty-dir

      - name: validate empty dir
        if: matrix.case == 'empty_dir'
        run: |
          set -euo pipefail
          [ -f /tmp/edge-tests/empty-dir/SHA256SUMS.txt ] || \
            { echo "::error::Checksums file not created"; exit 1; }
          [ ! -s /tmp/edge-tests/empty-dir/SHA256SUMS.txt ] || \
            { echo "::error::Expected empty file"; exit 1; }
          echo "✓ empty dir → empty checksums"

      # ── Default badge ──
      - name: default badge
        if: matrix.case == 'default_badge'
        uses: ai-warevo/.github/ci/actions/badge@main
        with:
          text_left: 'coverage'
          text_right: '100%'
          bg_color_right: '#44cc11'
          filename: /tmp/edge-tests/default.svg

      - name: validate default badge
        if: matrix.case == 'default_badge'
        run: |
          set -euo pipefail
          [ -f /tmp/edge-tests/default.svg ] || { echo "::error::Badge missing"; exit 1; }
          grep -q '<svg' /tmp/edge-tests/default.svg || { echo "::error::Invalid SVG"; exit 1; }
          echo "✓ default badge"
