# actions-test — Dispatcher for per-action test workflows
#
# Runs all test workflows in .github/actions/<name>/test.yml
# as reusable workflows via the matrix strategy.
#
# Usage:
#   gh workflow run actions-test.yml
#   gh workflow run actions-test.yml --field actions=badge,release-version

name: actions-test

on:
  workflow_dispatch:
    inputs:
      actions:
        description: 'Comma-separated list of actions to test (empty = all)'
        required: false
        default: ''

permissions:
  contents: read

jobs:
  # ──────────────────────────────────────────────
  # MATRIX — Call each action's test.yml directly
  # ──────────────────────────────────────────────
  matrix:
    name: ${{ matrix.action }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        action:
          # Unit tests (no extra permissions)
          - badge
          - release-version
          - changelog-generate
          - changelog-promote
          - changelog-release
          - checksums
          - checksums-verify
          - coverage-parser
          # Deploy tests (contents: write)
          - badge-deploy
          - coverage-html-deploy
          # Docker tests (packages: write)
          - docker-save
          - docker-build-push
          - docker-push-ghcr
          # Artifact tests (actions: read)
          - download-artifacts
          - collect-release-assets
          # Build + test (container mode)
          - cmake-build
          - ctest-run
          - gcovr-report
          - clang-format
          - clang-tidy
          - setup-toolchain
    steps:
      - name: Call test workflow
        uses: ai-vibeqodez/.github/.github/actions/${{ matrix.action }}/test.yml@${{ github.sha }}
