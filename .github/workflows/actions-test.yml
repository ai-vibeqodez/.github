# actions-test — Dispatcher for per-action test workflows
#
# Runs all test workflows in .github/actions/<name>/test.yml
# as reusable workflows via the matrix strategy.
#
# Usage:
#   gh workflow run actions-test.yml
#   gh workflow run actions-test.yml --field actions=badge,release-version

name: actions-test

on:
  workflow_dispatch:
    inputs:
      actions:
        description: 'Comma-separated list of actions to test (empty = all)'
        required: false
        default: ''

permissions:
  contents: read

jobs:
  # ──────────────────────────────────────────────
  # MATRIX — Dispatch each action's test.yml
  # ──────────────────────────────────────────────
  matrix:
    name: ${{ matrix.action }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        action:
          # Unit tests (no extra permissions)
          - badge
          - release-version
          - changelog-generate
          - changelog-promote
          - changelog-release
          - checksums
          - checksums-verify
          - coverage-parser
          # Deploy tests (contents: write)
          - badge-deploy
          - coverage-html-deploy
          # Docker tests (packages: write)
          - docker-save
          - docker-build-push
          - docker-push-ghcr
          # Artifact tests (actions: read)
          - download-artifacts
          - collect-release-assets
          # Build + test (container mode)
          - cmake-build
          - ctest-run
          - gcovr-report
          - clang-format
          - clang-tidy
          - setup-toolchain
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Dispatch test workflow
        run: gh workflow run test.yml --ref ${{ github.ref }} --field actions=${{ matrix.action }}
        working-directory: .github/actions/${{ matrix.action }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
