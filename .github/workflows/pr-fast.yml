# pr-fast — lint + build + unit tests on PR
#
# Triggers: pull_request / merge_group to main/master
# Jobs: clang-format, clang-tidy, cmake-build, ctest-run

name: pr-fast

on:
  pull_request:
    branches: [main, master]
  merge_group:
    branches: [main, master]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  clang-format:
    name: clang-format
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/ai-warevo/ci-cpp20
      options: --user root
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Check formatting
        uses: ai-warevo/.github/ci/actions/clang-format@66a569af12cee8bcbc8a0a7746b65a0b3e11bfb3
        with:
          source_dir: .
          extensions: "cpp,hpp,c,h"

  clang-tidy:
    name: clang-tidy
    runs-on: ubuntu-latest
    needs: clang-format
    container:
      image: ghcr.io/ai-warevo/ci-cpp20
      options: --user root
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Configure & Build
        uses: ai-warevo/.github/ci/actions/cmake-build@e9b20ed3a4f8a49bf774a1f1c28c4fb39e27bad5
        with:
          source_dir: example
          build_dir: build
          build_type: Debug
          extra_args: -DAW_EXAMPLE_BUILD_TESTS=ON

      - name: Run clang-tidy
        uses: ai-warevo/.github/ci/actions/clang-tidy@8a8099f57b65eb8282e8df7fc38fbb6b106676c6
        with:
          source_dir: example
          build_dir: build

  build-and-test:
    name: Build & Test
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/ai-warevo/ci-cpp20
      options: --user root
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Configure & Build
        uses: ai-warevo/.github/ci/actions/cmake-build@e9b20ed3a4f8a49bf774a1f1c28c4fb39e27bad5
        with:
          source_dir: example
          build_dir: build
          build_type: Debug
          extra_args: -DAW_EXAMPLE_BUILD_TESTS=ON

      - name: Run Tests
        uses: ai-warevo/.github/ci/actions/ctest-run@f9d6360ab55c7c8ec283dd036f96f0a20f0672fe
        with:
          source_dir: example
          build_dir: build
          config: Debug
          output_on_failure: 'true'
