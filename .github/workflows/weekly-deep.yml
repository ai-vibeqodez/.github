# weekly-deep — e2e, integration, sanitizers (ASan, TSan, UBSan) + coverage
#
# Triggers: weekly cron (Monday 00:00 UTC), manual dispatch
# Jobs: sanitizer checks, coverage report, badge deploy, HTML deploy

name: weekly-deep

on:
  schedule:
    - cron: '0 0 * * 1'  # every Monday at 00:00 UTC
  workflow_dispatch:

permissions:
  contents: write
  packages: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── Sanitizers ───────────────────────────────────────────────────────────
  sanitizer-asan:
    name: ASan + UBSan
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/ai-warevo/ci-cpp20
      options: --user root --security-opt seccomp=unconfined
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Configure & Build
        uses: ai-warevo/.github/ci/actions/cmake-build@e9b20ed3a4f8a49bf774a1f1c28c4fb39e27bad5
        with:
          source_dir: example
          build_dir: build
          build_type: RelWithDebInfo
          extra_args: -DAW_EXAMPLE_BUILD_TESTS=ON -DAW_EXAMPLE_SANITIZE=address

      - name: Run Tests
        uses: ai-warevo/.github/ci/actions/ctest-run@f9d6360ab55c7c8ec283dd036f96f0a20f0672fe
        with:
          source_dir: example
          build_dir: build
          timeout: 120

  sanitizer-tsan:
    name: TSan
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/ai-warevo/ci-cpp20
      options: --user root --security-opt seccomp=unconfined
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Configure & Build
        uses: ai-warevo/.github/ci/actions/cmake-build@e9b20ed3a4f8a49bf774a1f1c28c4fb39e27bad5
        with:
          source_dir: example
          build_dir: build
          build_type: RelWithDebInfo
          extra_args: -DAW_EXAMPLE_BUILD_TESTS=ON -DAW_EXAMPLE_SANITIZE=thread

      - name: Run Tests
        uses: ai-warevo/.github/ci/actions/ctest-run@f9d6360ab55c7c8ec283dd036f96f0a20f0672fe
        with:
          source_dir: example
          build_dir: build
          timeout: 120

  # ── Coverage ─────────────────────────────────────────────────────────────
  coverage:
    name: Coverage Report
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/ai-warevo/ci-cpp20
      options: --user root
    needs: [sanitizer-asan, sanitizer-tsan]
    if: success()
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Configure & Build
        uses: ai-warevo/.github/ci/actions/cmake-build@e9b20ed3a4f8a49bf774a1f1c28c4fb39e27bad5
        with:
          source_dir: example
          build_dir: build
          build_type: Debug
          extra_args: -DAW_EXAMPLE_BUILD_TESTS=ON -DAW_EXAMPLE_ENABLE_COVERAGE=ON

      - name: Run Tests
        uses: ai-warevo/.github/ci/actions/ctest-run@f9d6360ab55c7c8ec283dd036f96f0a20f0672fe
        with:
          source_dir: example
          build_dir: build
          config: Debug

      - name: Generate Coverage
        uses: ai-warevo/.github/ci/actions/gcovr-report@6754a01eb25624e84b8c3186ca48e2812462f63c
        with:
          source_dir: example
          build_dir: build
          source_filter: host/src/ plugin/src/ include/
          exclude: _deps/*
          output_dir: htmlcov

      - name: Parse Coverage Metrics
        id: coverage_parser
        uses: ai-warevo/.github/ci/actions/coverage-parser@535608f54753ec4631db924873b9b78ee561040e
        with:
          xml_path: coverage.xml

      - name: Generate Coverage Badge
        id: badge_generator
        uses: ai-warevo/.github/ci/actions/badge@8be273762e7d32d969e7a0e25118a6ec171520d4
        with:
          width: '99'
          height: '20'
          text_left: 'coverage'
          text_right: '${{ steps.coverage_parser.outputs.percent }}'
          bg_color_right: '${{ steps.coverage_parser.outputs.color }}'
          filename: 'coverage.svg'

      - name: Upload Badge
        if: success()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: coverage-badge
          path: coverage.svg
          retention-days: 1

      - name: Upload Coverage HTML
        if: success()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: coverage-html
          path: htmlcov/
          retention-days: 1

  # ── Deploy ───────────────────────────────────────────────────────────────
  deploy:
    name: Deploy Badges & HTML
    runs-on: ubuntu-latest
    needs: coverage
    if: success() && (!github.event.pull_request || !github.event.pull_request.head.repo.fork)
    permissions:
      contents: write
    steps:
      - name: Checkout repo
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0

      - name: Download Badge
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: coverage-badge
          path: .

      - name: Download Coverage HTML
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: coverage-html
          path: htmlcov/

      - name: Deploy Badge
        uses: ai-warevo/.github/ci/actions/badge-deploy@cbab0fc6ae03943e63200bb0d7f1543ad20df1a6
        with:
          badge_path: coverage.svg

      - name: Deploy Coverage HTML
        uses: ai-warevo/.github/ci/actions/coverage-html-deploy@37ba6d2f53694f58c8bee3318ce80a7dce8022fe
        with:
          folder: htmlcov
          target_folder: .
