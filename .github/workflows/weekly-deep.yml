# weekly-deep — e2e, integration, sanitizers (ASan, TSan, UBSan) + coverage
#
# Triggers: weekly cron (Monday 00:00 UTC), manual dispatch
# Jobs: sanitizer checks, coverage report, badge deploy, HTML deploy

name: weekly-deep

on:
  schedule:
    - cron: '0 0 * * 1'  # every Monday at 00:00 UTC
  workflow_dispatch:

permissions:
  contents: write
  packages: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── Sanitizers ───────────────────────────────────────────────────────────
  sanitizer-asan:
    name: ASan + UBSan
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/ai-warevo/ci-cpp20
      options: --user root --security-opt seccomp=unconfined
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Configure & Build
        uses: ai-warevo/.github/ci/actions/cmake-build@6e7a9d80109fde4952825dcad6da7bb11033b8ad
        with:
          source_dir: example
          build_dir: build
          build_type: RelWithDebInfo
          extra_args: -DAW_EXAMPLE_BUILD_TESTS=ON -DAW_EXAMPLE_SANITIZE=address

      - name: Run Tests
        uses: ai-warevo/.github/ci/actions/ctest-run@1f54d0c440088e71c26d5a9d68b2615b22c8ad3e
        with:
          source_dir: example
          build_dir: build
          timeout: 120

  sanitizer-tsan:
    name: TSan
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/ai-warevo/ci-cpp20
      options: --user root --security-opt seccomp=unconfined
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Configure & Build
        uses: ai-warevo/.github/ci/actions/cmake-build@6e7a9d80109fde4952825dcad6da7bb11033b8ad
        with:
          source_dir: example
          build_dir: build
          build_type: RelWithDebInfo
          extra_args: -DAW_EXAMPLE_BUILD_TESTS=ON -DAW_EXAMPLE_SANITIZE=thread

      - name: Run Tests
        uses: ai-warevo/.github/ci/actions/ctest-run@1f54d0c440088e71c26d5a9d68b2615b22c8ad3e
        with:
          source_dir: example
          build_dir: build
          timeout: 120

  # ── Coverage ─────────────────────────────────────────────────────────────
  coverage:
    name: Coverage Report
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/ai-warevo/ci-cpp20
      options: --user root
    needs: [sanitizer-asan, sanitizer-tsan]
    if: success()
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Configure & Build
        uses: ai-warevo/.github/ci/actions/cmake-build@6e7a9d80109fde4952825dcad6da7bb11033b8ad
        with:
          source_dir: example
          build_dir: build
          build_type: Debug
          extra_args: -DAW_EXAMPLE_BUILD_TESTS=ON -DAW_EXAMPLE_ENABLE_COVERAGE=ON

      - name: Run Tests
        uses: ai-warevo/.github/ci/actions/ctest-run@1f54d0c440088e71c26d5a9d68b2615b22c8ad3e
        with:
          source_dir: example
          build_dir: build
          config: Debug

      - name: Generate Coverage
        uses: ai-warevo/.github/ci/actions/gcovr-report@270b6eb01a85ebb4373ef8847a2649a888453fb4
        with:
          source_dir: example
          build_dir: build
          source_filter: host/src/ plugin/src/ include/
          exclude: _deps/*
          output_dir: htmlcov

      - name: Parse Coverage Metrics
        id: coverage_parser
        uses: ai-warevo/.github/ci/actions/coverage-parser@1a1658c7f0f5508078a5c60337e075518f260c57
        with:
          xml_path: coverage.xml

      - name: Generate Coverage Badge
        id: badge_generator
        uses: ai-warevo/.github/ci/actions/badge@28aa906a329d31e0493f4352bb5c02049ef28909
        with:
          width: '99'
          height: '20'
          text_left: 'coverage'
          text_right: '${{ steps.coverage_parser.outputs.percent }}'
          bg_color_right: '${{ steps.coverage_parser.outputs.color }}'
          filename: 'coverage.svg'

      - name: Upload Badge
        if: success()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: coverage-badge
          path: coverage.svg
          retention-days: 1

      - name: Upload Coverage HTML
        if: success()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: coverage-html
          path: htmlcov/
          retention-days: 1

  # ── Deploy ───────────────────────────────────────────────────────────────
  deploy:
    name: Deploy Badges & HTML
    runs-on: ubuntu-latest
    needs: coverage
    if: success() && (!github.event.pull_request || !github.event.pull_request.head.repo.fork)
    permissions:
      contents: write
    steps:
      - name: Checkout repo
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0

      - name: Download Badge
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: coverage-badge
          path: .

      - name: Download Coverage HTML
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: coverage-html
          path: htmlcov/

      - name: Deploy Badge
        uses: ai-warevo/.github/ci/actions/badge-deploy@462e8a0c5225f946d8b8c6f666dcf13826777354
        with:
          badge_path: coverage.svg

      - name: Deploy Coverage HTML
        uses: ai-warevo/.github/ci/actions/coverage-html-deploy@c352e784186b612d6d56df20d376dd407c6924a8
        with:
          folder: htmlcov
          target_folder: .
