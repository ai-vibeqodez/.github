# reusable-release — derive version → build → release + Docker
#
# Reusable workflow (workflow_call).
# Consumers call via:
#   uses: ai-warevo/.github/.github/workflows/reusable-release.yml@<sha>
#
# Parameters:
#   source_dir          — source directory (default: example)
#   build_dir           — build directory (default: build)
#   docker_context      — Docker build context (default: ./example)
#   dockerfile          — Dockerfile path (default: example/Dockerfile)
#   image_name          — Docker image name (default: ai-warevo/example)
#   version             — version override ("auto" to derive from changelog, or explicit e.g. 1.2.3)

name: reusable-release

on:
  workflow_call:
    inputs:
      source_dir:
        description: 'Source directory'
        type: string
        default: example
      build_dir:
        description: 'Build directory'
        type: string
        default: build
      docker_context:
        description: 'Docker build context'
        type: string
        default: ./example
      dockerfile:
        description: 'Dockerfile path'
        type: string
        default: example/Dockerfile
      image_name:
        description: 'Docker image name'
        type: string
        default: ai-warevo/example
      version:
        description: 'Version override ("auto" to derive from changelog, or explicit e.g. 1.2.3)'
        type: string
        default: 'auto'

permissions:
  contents: write
  packages: write
  actions: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # ── Phase 1: Derive version from changelog ──────────────────────────
  version-derive:
    name: Derive version
    runs-on: ubuntu-latest
    outputs:
      release_version: ${{ steps.version.outputs.release_version }}
      release_version_stripped: ${{ steps.version.outputs.release_version_stripped }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0

      - name: Generate changelog from git log
        if: github.event_name == 'workflow_dispatch'
        uses: ai-warevo/.github/.github/actions/changelog-generate@main
        with:
          force: 'true'

      - name: Resolve version
        id: version
        uses: ai-warevo/.github/.github/actions/release-version@main
        with:
          version: ${{ inputs.version }}

  # ── Phase 2: Build ──────────────────────────────────────────────────
  build-example:
    name: Build example
    runs-on: ubuntu-latest
    needs: version-derive
    outputs:
      release_version: ${{ needs.version-derive.outputs.release_version }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0

      - name: Build
        uses: ai-warevo/.github/.github/actions/cmake-build@main
        with:
          source_dir: ${{ inputs.source_dir }}
          build_dir: ${{ inputs.build_dir }}
          build_type: Release
          extra_args: -DAW_EXAMPLE_BUILD_TESTS=OFF

      - name: Upload libplugin.so
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: libplugin-${{ needs.version-derive.outputs.release_version }}
          path: ${{ inputs.source_dir }}/build/plugin/libplugin.so

      - name: Upload host
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: host-${{ needs.version-derive.outputs.release_version }}
          path: ${{ inputs.source_dir }}/build/host

  # ── Phase 3: Publish release + Docker ───────────────────────────────
  release-publish:
    name: Publish release
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0

      # ── Promote changelog ──
      - name: Promote changelog
        if: github.event_name == 'workflow_dispatch'
        uses: ai-warevo/.github/.github/actions/changelog-promote@main
        with:
          version: ${{ needs.version-derive.outputs.release_version_stripped }}

      # ── Commit and tag ──
      - name: Commit CHANGELOG.md and VERSION
        if: github.event_name == 'workflow_dispatch'
        run: |
          set -euo pipefail
          tag="${{ needs.version-derive.outputs.release_version }}"
          if git rev-parse -q --verify "refs/tags/$tag" >/dev/null; then
            echo "::error::Tag $tag already exists; refusing to overwrite it"
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add CHANGELOG.md VERSION
          git diff --cached --quiet && { echo "::error::Release metadata has no changes; refusing to create a duplicate release"; exit 1; }
          git commit -m "chore(release): version ${{ needs.version-derive.outputs.release_version_stripped }}"
          git tag -a "${{ needs.version-derive.outputs.release_version }}" -m "Release ${{ needs.version-derive.outputs.release_version }}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
          git push origin "${{ needs.version-derive.outputs.release_version }}"

      - name: Download build artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: libplugin-${{ needs.version-derive.outputs.release_version }}
          path: artifacts

      - name: Download host artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: host-${{ needs.version-derive.outputs.release_version }}
          path: artifacts

      # ── Checksums ──
      - name: Generate checksums
        uses: ai-warevo/.github/.github/actions/checksums@main
        with:
          artifacts_dir: 'artifacts'
          checksums_file: 'SHA256SUMS.txt'

      - name: Verify checksums
        uses: ai-warevo/.github/.github/actions/checksums-verify@main
        with:
          artifacts_dir: 'artifacts'
          checksums_file: 'SHA256SUMS.txt'

      # ── Create GitHub Release ──
      - name: Generate Release Notes
        id: changelog
        uses: ai-warevo/.github/.github/actions/changelog-release@main
        with:
          tag: ${{ needs.version-derive.outputs.release_version }}

      - name: Create Release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65
        with:
          tag_name: ${{ needs.version-derive.outputs.release_version }}
          name: ${{ needs.version-derive.outputs.release_version }}
          body_path: ${{ steps.changelog.outputs.body_path }}
          files: |
            artifacts/SHA256SUMS.txt
            artifacts/libplugin.so
            artifacts/host
          generate_release_notes: false

      # ── Docker ──
      - name: Build and push Docker image
        uses: ai-warevo/.github/.github/actions/docker-build-push@main
        with:
          context: ${{ inputs.docker_context }}
          dockerfile: ${{ inputs.dockerfile }}
          image_name: ${{ inputs.image_name }}
          tags: |
            ghcr.io/ai-warevo/${{ inputs.image_name }}:${{ needs.version-derive.outputs.release_version }}
            ghcr.io/ai-warevo/${{ inputs.image_name }}:latest
