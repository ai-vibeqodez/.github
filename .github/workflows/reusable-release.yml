# reusable-release — build + release + publish Docker image
#
# Reusable workflow (workflow_call).
# Consumers call via:
#   uses: ai-warevo/.github/.github/workflows/reusable-release.yml@<sha>
#
# Parameters:
#   source_dir          — source directory (default: example)
#   build_dir           — build directory (default: build)
#   docker_context      — Docker build context (default: ./example)
#   dockerfile          — Dockerfile path (default: example/Dockerfile)
#   image_name          — Docker image name (default: ai-warevo/example)
#   version             — version override (optional, for workflow_dispatch)

name: reusable-release

on:
  workflow_call:
    inputs:
      source_dir:
        description: 'Source directory'
        type: string
        default: example
      build_dir:
        description: 'Build directory'
        type: string
        default: build
      docker_context:
        description: 'Docker build context'
        type: string
        default: ./example
      dockerfile:
        description: 'Dockerfile path'
        type: string
        default: example/Dockerfile
      image_name:
        description: 'Docker image name'
        type: string
        default: ai-warevo/example
      version:
        description: 'Version override (empty = derive from tag or snapshot)'
        type: string
        default: ''

permissions:
  contents: write
  packages: write
  actions: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-example:
    name: Build example
    runs-on: ubuntu-latest
    outputs:
      release_version: ${{ steps.version.outputs.release_version }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0

      - name: Resolve version
        id: version
        uses: ./.github/actions/release-version@4b417da2a7ff8570a032237b1437cf677c88fc86
        with:
          version: ${{ inputs.version }}

      - name: Build
        uses: ./.github/actions/cmake-build@e9b20ed3a4f8a49bf774a1f1c28c4fb39e27bad5
        with:
          source_dir: ${{ inputs.source_dir }}
          build_dir: ${{ inputs.build_dir }}
          build_type: Release
          extra_args: -DAW_EXAMPLE_BUILD_TESTS=OFF

      - name: Upload libplugin.so
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: libplugin-${{ steps.version.outputs.release_version }}
          path: ${{ inputs.source_dir }}/build/plugin/libplugin.so

      - name: Upload host
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: host-${{ steps.version.outputs.release_version }}
          path: ${{ inputs.source_dir }}/build/host

  release:
    name: Publish GitHub Release
    runs-on: ubuntu-latest
    needs: build-example
    outputs:
      release_version: ${{ needs.build-example.outputs.release_version }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0

      - name: Generate Release Body
        id: changelog
        uses: ./.github/actions/changelog-release@d82701c539be4ee85ebed40d2417d48977628f4b
        with:
          tag: ${{ needs.build-example.outputs.release_version }}

      - name: Download build artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: libplugin-${{ needs.build-example.outputs.release_version }}
          path: artifacts

      - name: Download host artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: host-${{ needs.build-example.outputs.release_version }}
          path: artifacts

      - name: Generate checksums
        id: checksums_generate
        uses: ./.github/actions/checksums@5a26e989b5fba8076bbf7f4800ec19a94e5096b1
        with:
          artifacts_dir: 'artifacts'
          checksums_file: 'SHA256SUMS.txt'

      - name: Verify checksums
        uses: ./.github/actions/checksums-verify@b6fea8cbedfa146c2de4e0180f19c4d11d90325d
        with:
          artifacts_dir: 'artifacts'
          checksums_file: 'SHA256SUMS.txt'

      - name: Create Release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65
        with:
          tag_name: ${{ needs.build-example.outputs.release_version }}
          name: ${{ needs.build-example.outputs.release_version }}
          body_path: ${{ steps.changelog.outputs.body_path }}
          files: |
            artifacts/SHA256SUMS.txt
            artifacts/libplugin.so
            artifacts/host
          generate_release_notes: false

  docker:
    name: Build and push Docker image
    runs-on: ubuntu-latest
    needs: release

    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Build and push Docker image
        uses: ./.github/actions/docker-build-push@d63404d832482c378b790598a99bf53baf10ca8e
        with:
          context: ${{ inputs.docker_context }}
          dockerfile: ${{ inputs.dockerfile }}
          image_name: ${{ inputs.image_name }}
          tags: |
            ghcr.io/ai-warevo/${{ inputs.image_name }}:${{ needs.release.outputs.release_version }}
            ghcr.io/ai-warevo/${{ inputs.image_name }}:latest
