name: Reusable Release Gate

on:
  workflow_call:
    inputs:
      setup-command:
        description: Optional shell command to install the caller repository's toolchain
        required: false
        type: string
        default: ''

permissions:
  contents: read

concurrency:
  group: reusable-release-${{ github.repository }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  ci-fast:
    name: Fast verification
    runs-on: ubuntu-latest
    steps:
      - name: Checkout caller repository
        uses: actions/checkout@v4
      - name: Set up caller toolchain
        if: ${{ inputs.setup-command != '' }}
        shell: bash
        env:
          SETUP_COMMAND: ${{ inputs.setup-command }}
        run: eval "$SETUP_COMMAND"
      - name: Run fast CI contract
        run: make ci-fast

  ci-deep:
    name: Deep verification
    runs-on: ubuntu-latest
    steps:
      - name: Checkout caller repository
        uses: actions/checkout@v4
      - name: Set up caller toolchain
        if: ${{ inputs.setup-command != '' }}
        shell: bash
        env:
          SETUP_COMMAND: ${{ inputs.setup-command }}
        run: eval "$SETUP_COMMAND"
      - name: Run deep CI contract
        run: make ci-deep

  build-release:
    name: Build and publish release
    needs: [ci-fast, ci-deep]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout tagged caller repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
      - name: Set up caller toolchain
        if: ${{ inputs.setup-command != '' }}
        shell: bash
        env:
          SETUP_COMMAND: ${{ inputs.setup-command }}
        run: eval "$SETUP_COMMAND"
      - name: Build optimized release artifacts
        run: make build-release
      - name: Extract exact changelog section
        id: notes
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$RELEASE_TAG" =~ ^v([0-9]+\\.[0-9]+\\.[0-9]+)$ ]] || { echo "Expected a vX.Y.Z tag, got: $RELEASE_TAG" >&2; exit 1; }
          version="${BASH_REMATCH[1]}"
          notes_file="$RUNNER_TEMP/release-notes.md"
          awk -v version="$version" '
            $0 ~ "^## \\[" version "\\]" { found=1; next }
            found && /^## / { exit }
            found { print }
            END { if (!found) exit 2 }
          ' CHANGELOG.md > "$notes_file" || { echo "No CHANGELOG.md section found for $version" >&2; exit 1; }
          [[ -s "$notes_file" ]] || { echo "CHANGELOG section for $version is empty" >&2; exit 1; }
          echo "path=$notes_file" >> "$GITHUB_OUTPUT"
      - name: Create GitHub Release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          body_path: ${{ steps.notes.outputs.path }}
          files: dist/**
          generate_release_notes: false
          fail_on_unmatched_files: true
