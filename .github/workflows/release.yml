# Release — Publish GitHub Release from CHANGELOG (monorepo)
#
# Triggers:
#   - tag push v* → release from CHANGELOG
#   - workflow_dispatch → manual release with version (input) or snapshot (v0.0.<run_number>)
# Calls: reusable-release.yml

name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Semantic version without v prefix (e.g. 1.2.3). Leave empty for snapshot.'
        required: false
        default: ''

permissions:
  contents: write
  packages: write
  actions: write

jobs:
  release:
    uses: ./.github/workflows/reusable-release.yml
    with:
      source_dir: example
      build_dir: build
      docker_context: ./example
      dockerfile: example/Dockerfile
      image_name: example
      version: ${{ github.event.inputs.version }}
