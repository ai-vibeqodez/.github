# Release — Publish GitHub Release from CHANGELOG
#
# Триггеры:
#   - push тега v* → релиз из CHANGELOG
#   - workflow_dispatch → ручной релиз с версией (input) или snapshot (v0.0.<run_number>)
# Использует composite actions: release-version, changelog-release, checksums, docker-build-push

name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Semantic version without v prefix (e.g. 1.2.3). Leave empty for snapshot.'
        required: false
        default: ''

permissions:
  contents: write
  packages: write
  actions: write

# Не отменяем релиз-запуски — они должны завершиться
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # ── Build example (C++23 plugin + host) ─────────────────────────────────
  build-example:
    name: Build example
    runs-on: ubuntu-latest
    outputs:
      release_version: ${{ steps.version.outputs.release_version }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve version
        id: version
        uses: ai-warevo/.github/ci/actions/release-version@main
        with:
          version: ${{ github.event.inputs.version }}

      - name: Build
        uses: ai-warevo/.github/ci/actions/cmake-build@main
        with:
          source_dir: example
          build_dir: build
          build_type: Release
          extra_args: -DAW_EXAMPLE_BUILD_TESTS=OFF

      - name: Upload libplugin.so
        uses: actions/upload-artifact@v4
        with:
          name: libplugin-${{ steps.version.outputs.release_version }}
          path: example/build/libplugin.so

      - name: Upload host
        uses: actions/upload-artifact@v4
        with:
          name: host-${{ steps.version.outputs.release_version }}
          path: example/build/host

  # ── Release job ──────────────────────────────────────────────────────────
  release:
    name: Publish GitHub Release
    runs-on: ubuntu-latest
    needs: build-example
    outputs:
      release_version: ${{ needs.build-example.outputs.release_version }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Generate Release Body
        id: changelog
        uses: ai-warevo/.github/ci/actions/changelog-release@main
        with:
          tag: ${{ needs.build-example.outputs.release_version }}

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: 'libplugin-*'
          merge-multiple: true
          path: .

      - name: Download host artifact
        uses: actions/download-artifact@v4
        with:
          pattern: 'host-*'
          merge-multiple: true
          path: .

      - name: Generate checksums
        id: checksums_generate
        uses: ai-warevo/.github/ci/actions/checksums@main
        with:
          artifacts_dir: '.'
          checksums_file: 'SHA256SUMS.txt'

      - name: Verify checksums
        uses: ai-warevo/.github/ci/actions/checksums-verify@main
        with:
          artifacts_dir: '.'
          checksums_file: 'SHA256SUMS.txt'

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.build-example.outputs.release_version }}
          name: ${{ needs.build-example.outputs.release_version }}
          body_path: ${{ steps.changelog.outputs.body_path }}
          files: |
            SHA256SUMS.txt
            libplugin-${{ needs.build-example.outputs.release_version }}.so
            host-${{ needs.build-example.outputs.release_version }}
          generate_release_notes: false

  # ── Docker image build + GHCR push ──────────────────────────────────────
  docker:
    name: Build and push Docker image
    runs-on: ubuntu-latest
    needs: release

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build and push Docker image
        uses: ai-warevo/.github/ci/actions/docker-build-push@main
        with:
          context: ./example
          dockerfile: example/Dockerfile
          image_name: ai-warevo/example
          tags: |
            ghcr.io/ai-warevo/example:${{ needs.release.outputs.release_version }}
            ghcr.io/ai-warevo/example:latest
