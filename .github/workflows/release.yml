# Release — Publish GitHub Release from CHANGELOG
#
# Скопируй этот файл в свой проект как .github/workflows/release.yml
#
# Триггеры:
#   - push тега v* → релиз из CHANGELOG
#   - workflow_dispatch → ручной релиз с версией (input) или snapshot (v0.0.<run_number>)
# Использует composite actions: release-version, changelog-release, checksums

name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Semantic version without v prefix (e.g. 1.2.3). Leave empty for snapshot.'
        required: false
        default: ''

permissions:
  contents: write
  packages: write
  actions: write

# Не отменяем релиз-запуски — они должны завершиться
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Publish GitHub Release
    runs-on: ubuntu-latest
    outputs:
      release_version: ${{ steps.version.outputs.release_version }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve version
        id: version
        uses: ai-warevo/.github/ci/actions/release-version@main
        with:
          version: ${{ github.event.inputs.version }}

      - name: Generate Release Body
        id: changelog
        uses: ai-warevo/.github/ci/actions/changelog-release@main
        with:
          tag: ${{ steps.version.outputs.release_version }}

      - name: Download build artifacts
        if: ${{ always() }}
        uses: ai-warevo/.github/ci/actions/download-artifacts@main
        with:
          pattern: 'libplugin-*'
          merge-multiple: true
          path: .

      - name: Download host artifact
        if: ${{ always() }}
        uses: ai-warevo/.github/ci/actions/download-artifacts@main
        with:
          pattern: 'host-*'
          merge-multiple: true
          path: .

      - name: Generate checksums
        id: checksums_generate
        uses: ai-warevo/.github/ci/actions/checksums@main
        with:
          artifacts_dir: '.'
          checksums_file: 'SHA256SUMS.txt'

      - name: Verify checksums
        uses: ai-warevo/.github/ci/actions/checksums-verify@main
        with:
          artifacts_dir: '.'
          checksums_file: 'SHA256SUMS.txt'

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.release_version }}
          name: ${{ steps.version.outputs.release_version }}
          body_path: ${{ steps.changelog.outputs.body_path }}
          files: |
            SHA256SUMS.txt
            libplugin-${{ steps.version.outputs.release_version }}.so
            host-${{ steps.version.outputs.release_version }}
          generate_release_notes: false

  # ── Build example (C++23 plugin + host) ─────────────────────────────────
  build-example:
    name: Build example
    runs-on: ubuntu-latest
    needs: release

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up CMake and build
        working-directory: example
        run: |
          cmake -B build -DCMAKE_BUILD_TYPE=Release -DAW_EXAMPLE_BUILD_TESTS=OFF
          cmake --build build -j"$(nproc)"

      - name: Upload libplugin.so
        uses: actions/upload-artifact@v4
        with:
          name: libplugin-${{ needs.release.outputs.release_version }}
          path: example/build/libplugin.so

      - name: Upload host
        uses: actions/upload-artifact@v4
        with:
          name: host-${{ needs.release.outputs.release_version }}
          path: example/build/host

  # ── Docker image build + GHCR push ──────────────────────────────────────
  docker:
    name: Build and push Docker image
    runs-on: ubuntu-latest
    needs: release

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Debug — list example directory
        run: ls -la example/ && echo "---" && cat example/Dockerfile

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: example/Dockerfile
          push: true
          tags: |
            ghcr.io/ai-warevo/example:${{ needs.release.outputs.release_version }}
            ghcr.io/ai-warevo/example:latest
