# Release — Publish GitHub Release from CHANGELOG (monorepo)
#
# Triggers:
#   - tag push v* → release from CHANGELOG (manual tag creation)
#   - workflow_dispatch → auto-release: generates changelog, derives version, publishes release

name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write
  packages: write
  actions: write

jobs:
  release:
    uses: ai-warevo/.github/.github/workflows/reusable-release.yml@main
    with:
      source_dir: example
      build_dir: build
      docker_context: ./example
      dockerfile: example/Dockerfile
      image_name: example
      version: auto
