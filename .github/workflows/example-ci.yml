name: example-tests

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'example/**'
      - '.github/workflows/example-ci.yml'
  pull_request:
    branches: [main]
    paths:
      - 'example/**'
      - '.github/workflows/example-ci.yml'

permissions:
  contents: write

jobs:
  tests-and-coverage:
    name: Tests & Coverage
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install gcovr
        run: sudo apt-get update && sudo apt-get install -y gcovr

      - name: Configure & Build Tests with Coverage
        env:
          CC: gcc
          CXX: g++
        run: |
          cmake -S example -B build \
            -DCMAKE_BUILD_TYPE=Debug \
            -DAW_EXAMPLE_BUILD_TESTS=ON \
            -DAW_EXAMPLE_ENABLE_COVERAGE=ON
          cmake --build build --parallel

      - name: Run CTest
        run: ctest --test-dir build -C Debug --output-on-failure

      - name: Generate Coverage Reports (XML & HTML)
        run: |
          mkdir -p htmlcov
          gcovr -r build/ \
            --gcov-ignore-errors=no_working_dir_found \
            --filter 'example/' \
            --exclude 'build/_deps/*' \
            --exclude-unreachable-branches \
            --exclude-throw-branches \
            --print-summary \
            --xml coverage.xml \
            --html-details htmlcov/index.html

      - name: Parse Coverage Metrics
        id: coverage_parser
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: ./.github/ci/actions/coverage-parser
        with:
          xml_path: coverage.xml

      - name: Generate Coverage Badge
        id: badge_generator
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: ai-warevo/.github/ci/actions/badge@main
        with:
          width: '99'
          height: '20'
          text_left: 'coverage'
          text_right: '${{ steps.coverage_parser.outputs.percent }}'
          bg_color_right: '${{ steps.coverage_parser.outputs.color }}'
          filename: 'coverage.svg'

      - name: Isolate Badge for Deploy
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          mkdir -p badge-upload
          cp "${{ steps.badge_generator.outputs.badge_path }}" badge-upload/coverage.svg

      - name: Deploy Badge
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          branch: badges
          folder: badge-upload
          target-folder: .
          git-config-name: "github-actions[bot]"
          git-config-email: "github-actions[bot]@users.noreply.github.com"
          single-commit: true

      - name: Deploy Coverage Report to gh-pages
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          touch htmlcov/.nojekyll

      - name: Deploy Coverage HTML
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          branch: gh-pages
          folder: htmlcov

  sanitizers:
    name: Sanitizers (${{ matrix.sanitizer }})
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        sanitizer: [ address, thread ]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Relax ASLR for ThreadSanitizer
        if: matrix.sanitizer == 'thread'
        run: sudo sysctl vm.mmap_rnd_bits=28

      - name: Configure & Build
        env:
          CC: gcc
          CXX: g++
        run: |
          cmake -S example -B build \
            -DCMAKE_BUILD_TYPE=RelWithDebInfo \
            -DAW_EXAMPLE_BUILD_TESTS=ON \
            -DAW_EXAMPLE_SANITIZE=${{ matrix.sanitizer }}
          cmake --build build --parallel

      - name: Run CTest
        run: ctest --test-dir build --output-on-failure --timeout 120
